name: Daten aus der Dropbox

# zweimal pro Stunde (GitHub startet geplante Läufe oft verspätet oder lässt einzelne aus) und von Hand über «Run workflow»
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Alles neu einlesen (ja/nein)"
        default: "nein"

permissions:
  contents: write

concurrency:
  group: dropbox-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Werkzeuge
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y poppler-utils >/dev/null
          pip install -q cryptography==43.0.3 requests==2.32.3 imageio-ffmpeg==0.5.1
      - name: Dropbox lesen und Daten erzeugen
        env:
          CREW_KEY: ${{ secrets.CREW_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_ROOT: ${{ vars.DROPBOX_ROOT }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          FORCE: ${{ github.event.inputs.force }}
        run: python tools/update_from_dropbox.py
      - name: Veröffentlichen
        if: always()
        run: |
          git add -N status.json blk 2>/dev/null || true
          if git diff --quiet -- data.enc.json script.enc.json status.json blk; then echo "nichts zu veröffentlichen"; exit 0; fi
          git config user.name "Crew-App Aktualisierung"
          git config user.email "actions@users.noreply.github.com"
          git add -A data.enc.json script.enc.json status.json blk
          git commit -q -m "Daten aktualisiert (Dropbox)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
