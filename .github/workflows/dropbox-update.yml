name: Daten aus der Dropbox

# vom Cloudflare Worker alle 30 Minuten gestartet; der eigene Zeitplan (stündlich) ist nur die Reserve; von Hand über «Run workflow»
on:
  schedule:
    - cron: "37 * * * *"   # only the reserve: the Cloudflare worker starts this every 30 minutes (else everything ran twice)
  workflow_dispatch:
    inputs:
      force:
        description: "Alles neu einlesen (ja/nein)"
        default: "nein"
      trigger:
        description: "cron = vom Worker-Zeitplan gestartet (leer lassen)"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: dropbox-update
  cancel-in-progress: false

jobs:
  # the hourly schedule is only the reserve: skipped when the worker started a run in the last 25 minutes
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.res.outputs.skip }}
    steps:
      - id: res
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/dropbox-update.yml/runs?per_page=1&event=workflow_dispatch" -q '.workflow_runs[0].created_at' 2>/dev/null || echo "")
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 1500 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::notice::Reserve-Lauf übersprungen – vor weniger als 25 Minuten aktualisiert"; fi
  update:
    needs: reserve
    if: needs.reserve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always the newest state (a queued run would otherwise start from old data)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Werkzeuge
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y poppler-utils >/dev/null
          pip install -q cryptography==43.0.3 requests==2.32.3 imageio-ffmpeg==0.5.1 pillow==11.0.0 boto3==1.35.54
      - name: Dropbox lesen und Daten erzeugen
        env:
          CREW_KEY: ${{ secrets.CREW_KEY }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          BLK_BASE: ${{ vars.BLK_BASE }}
          TRIGGER: ${{ github.event.inputs.trigger }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_ROOT: ${{ vars.DROPBOX_ROOT }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_MODEL_SMALL: ${{ vars.CLAUDE_MODEL_SMALL }}
          AI_DAY_USD: ${{ vars.AI_DAY_USD }}
          FORCE: ${{ github.event.inputs.force }}
        run: python tools/update_from_dropbox.py
      # erfolgreich: Daten, Bilder und Status; fehlgeschlagen: nur der Status (nie halbe Daten oder gelöschte Bilder)
      - name: Veröffentlichen
        if: success()
        env:
          R2_ON: ${{ secrets.R2_ACCOUNT_ID != '' && vars.BLK_BASE != '' }}
        run: |
          git config user.name "Crew-App Aktualisierung"
          git config user.email "actions@users.noreply.github.com"
          if [ "$R2_ON" = "true" ]; then
            # Bilder liegen in Cloudflare R2: nicht mehr im Repository führen
            git rm -r -q --cached --ignore-unmatch blk
            grep -qx 'blk/' .gitignore 2>/dev/null || echo 'blk/' >> .gitignore
            git add .gitignore; PATHS="data.enc.json media.enc.json contacts.enc.json script.enc.json status.json stamp.json"
          else
            git add -N status.json stamp.json blk 2>/dev/null || true; PATHS="data.enc.json media.enc.json contacts.enc.json script.enc.json status.json stamp.json blk"
          fi
          git add -A $PATHS 2>/dev/null || true
          if git diff --cached --quiet; then echo "nichts zu veröffentlichen"; exit 0; fi
          git commit -q -m "Daten aktualisiert (Dropbox)"
          git config http.postBuffer 524288000
          du -sh blk || true
          for i in 1 2 3; do git pull -q --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
      # Push bei Änderungen (Drehplan, Callsheet, Prep): erst wenn die neuen Daten online sind
      - name: Push bei Änderungen
        if: success() && hashFiles('pending_push.json') != ''
        continue-on-error: true   # the data is already online: a failed push must not count as a failed update
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          CREW_KEY: ${{ secrets.CREW_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # wait until GitHub Pages serves the new data (at most 5 minutes), so a tap on the push shows it
          want=$(python -c "import json;print(json.load(open('stamp.json')).get('s',''))" 2>/dev/null)
          for i in $(seq 1 30); do
            live=$(curl -fsS --max-time 15 "https://furtschellas.github.io/Tschugger/stamp.json?t=$(date +%s)" | python -c "import json,sys;print(json.load(sys.stdin).get('s',''))" 2>/dev/null)
            [ -n "$want" ] && [ "$live" = "$want" ] && break; sleep 10
          done
          python tools/notify_changes.py
          gh api -X POST repos/${{ github.repository }}/actions/workflows/push.yml/dispatches -f ref=main || true
      # Telefon und Kontakt-E-Mail der Profile: von members nach contacts (nur einmal nötig; danach nichts mehr zu tun)
      # Push-Nachrichten, die beim letzten Mal nicht angelegt werden konnten (warten verschlüsselt in Firestore)
      - name: Ausstehende Push-Nachrichten
        if: success() && hashFiles('pending_push.json') == ''
        continue-on-error: true
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          CREW_KEY: ${{ secrets.CREW_KEY }}
        run: python tools/notify_changes.py
      - name: Kontaktdaten verschieben
        if: success()
        continue-on-error: true
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python tools/migrate_contacts.py
      - name: Status bei Fehler veröffentlichen
        if: failure() || cancelled()   # also when the 40-minute limit stopped the run
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          CREW_KEY: ${{ secrets.CREW_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -- data.enc.json script.enc.json 2>/dev/null || true
          python tools/fail_alarm.py || true
          [ -f .alarm_sent ] && gh api -X POST repos/${{ github.repository }}/actions/workflows/push.yml/dispatches -f ref=main || true
          git diff --quiet -- status.json && exit 0
          git config user.name "Crew-App Aktualisierung"
          git config user.email "actions@users.noreply.github.com"
          git add status.json && git commit -q -m "Status: Aktualisierung fehlgeschlagen"
          for i in 1 2 3; do git pull -q --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
