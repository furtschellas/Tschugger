name: Website veröffentlichen

# Die App (index.html) wird HIER gebaut, getestet und nur bei bestandenen Tests veröffentlicht: erst dann wird die gebaute
# index.html nach main geschrieben (von dort holt sie GitHub Pages). Im Repository wird index.html nie von Hand geändert –
# schlägt ein Test fehl, bleibt die laufende App unverändert. Reine Daten-Aktualisierungen (Dropbox) gehen ohne Test gleich online.
# Einmalig nötig: Repository → Settings → Pages → Source: «GitHub Actions».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            code:
              - 'index.html'
              - 'sw.js'
              - 'manifest.webmanifest'
              - 'tools/app.html'
              - 'tools/boot/**'
              - 'tools/web_style.css'
              - 'tools/a2hs.js'
              - 'tests/**'
              - 'tools/*.py'
              - 'firestore.rules'
              - '.github/workflows/pages.yml'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Werkzeuge
        run: |
          pip install -q playwright==1.48.0 cryptography==43.0.3 requests==2.32.3 pywebpush==2.0.1 icalendar==6.1.0 recurring-ical-events==3.3.3 pillow==11.0.0
          python -m playwright install --with-deps chromium >/dev/null
      # the app is built here from tools/ (never taken from a hand-made index.html) and must start without any script error
      - name: App bauen
        run: |
          npm install -g esbuild@0.24.0 --no-audit --no-fund --loglevel=error || true
          ESBUILD=$(command -v esbuild || true) python tools/make_site.py
          mkdir -p /tmp/site && cp index.html version.txt /tmp/site/
      - name: App startet ohne Fehler
        run: python tests/boot_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: /tmp/site/
      # alle Teile laufen, auch wenn einer fehlschlägt; am Schluss zählt das Gesamtergebnis
      - name: Hintergrund (Dropbox-Aktualisierung, Push, Alarm, Google Kalender)
        id: t1
        continue-on-error: true
        env:
          TESTS_OUT: /tmp/t-backend.json
        run: python tests/test_backend.py
      - name: App (sechs Rollen, Handy und Desktop)
        id: t2
        continue-on-error: true
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          CREW_KEY: ${{ secrets.CREW_KEY }}
          TESTS_OUT: /tmp/t-app.json
        run: python tests/smoke.py
      - name: Funktionen (Suche, Drehplan, Termine, Konto, Push, vCard, offline, Rechte, Sprachen)
        id: t3
        continue-on-error: true
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          CREW_KEY: ${{ secrets.CREW_KEY }}
          TESTS_OUT: /tmp/t-func.json
        run: python tests/func.py
      - name: Sicherheit (Repository, Seite, Verschlüsselung, Worker, eingeschleuster Code)
        id: t4
        continue-on-error: true
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          CREW_KEY: ${{ secrets.CREW_KEY }}
          TESTS_OUT: /tmp/t-sec.json
        run: python tests/security.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-app
          path: /tmp/t-*.json
      - name: Gesamtergebnis
        if: steps.t1.outcome != 'success' || steps.t2.outcome != 'success' || steps.t3.outcome != 'success' || steps.t4.outcome != 'success'
        run: exit 1

  rules:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Werkzeuge
        working-directory: tests
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Firestore-Regeln im Emulator
        working-directory: tests
        env:
          TESTS_OUT: /tmp/t-rules.json
        run: npx firebase emulators:exec --only firestore --project demo-tschugger --config firebase.json "node rules.test.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-rules
          path: /tmp/t-rules.json

  deploy:
    needs: [changes, test, rules]
    if: always() && needs.changes.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.rules.result == 'success' || needs.rules.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: site
          path: .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: d
        uses: actions/deploy-pages@v4

  # results (only check names and ✓/✗) for App-Verwaltung → Log; also when the tests fail.
  # Committed only AFTER the deployment, otherwise the two Pages deployments get in each other's way.
  results:
    needs: [test, rules, deploy]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'failure' || needs.rules.result == 'success' || needs.rules.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: /tmp/res
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: needs.test.result == 'success' && (needs.rules.result == 'success' || needs.rules.result == 'skipped')
        continue-on-error: true
        with:
          name: site
          path: /tmp/site
      - name: Ins Repository
        run: |
          python3 tests/merge_results.py /tmp/tests.json "Hintergrund=/tmp/res/t-backend.json" "App=/tmp/res/t-app.json" "Funktionen=/tmp/res/t-func.json" "Sicherheit=/tmp/res/t-sec.json" "Firestore-Regeln=/tmp/res/t-rules.json"
          git config user.name "Crew-App Tests"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main && cp /tmp/tests.json tests.json && git add tests.json
            # all tests passed: the tested app goes live (GitHub Pages takes index.html from main)
            msg="Testresultate"
            if [ -f /tmp/site/index.html ]; then cp /tmp/site/index.html /tmp/site/version.txt . && git add index.html version.txt && msg="App veröffentlicht (alle Tests bestanden) · Testresultate"; fi
            git diff --cached --quiet && break
            git commit -q -m "$msg" && git push -q origin HEAD:main && break
            sleep 5
          done
