name: Website veröffentlichen

# Die App (index.html) wird HIER gebaut, getestet und nur bei bestandenen Tests veröffentlicht: erst dann wird die gebaute
# index.html nach main geschrieben (von dort holt sie GitHub Pages). Im Repository wird index.html nie von Hand geändert –
# schlägt ein Test fehl, bleibt die laufende App unverändert. Reine Daten-Aktualisierungen (Dropbox) gehen ohne Test gleich online.
# GitHub Pages: Repository → Settings → Pages → Source «Deploy from a branch» (main, Hauptordner) – veröffentlicht wird mit dem
# Commit der getesteten index.html nach main (Job «results»); Daten-Aktualisierungen gehen über denselben Weg online.
on:
  push:
    branches: [main]
  workflow_dispatch:

# nur lesen; Pages-Rechte bekommt allein der Veröffentlichen-Job
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.f.outputs.code }}
      rules: ${{ steps.f.outputs.rules }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad   # v3.0.4, fest (fremde Action)
        id: f
        with:
          filters: |
            code:
              - 'index.html'
              - 'sw.js'
              - 'manifest.webmanifest'
              - 'tools/app.html'
              - 'tools/boot/**'
              - 'tools/base/**'
              - 'tools/splash.html'
              - 'tools/web_head.html'
              - 'tools/chat_worker.js'
              - 'tools/web_style.css'
              - 'tools/a2hs.js'
              - 'tests/**'
              - 'tools/*.py'
              - 'firestore.rules'
              - '.github/workflows/pages.yml'
            rules:
              - 'firestore.rules'
              - 'tools/deploy_rules.py'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # up to three tries: a short network hiccup while installing must not make the whole test run «crash»
      - name: Werkzeuge
        run: |
          for i in 1 2 3; do
            pip install -q playwright==1.48.0 cryptography==43.0.3 requests==2.32.3 pywebpush==2.0.1 icalendar==6.1.0 recurring-ical-events==3.3.3 pillow==11.0.0 openpyxl==3.1.5 \
              && python -m playwright install --with-deps chromium >/dev/null && exit 0
            echo "::warning::Installation fehlgeschlagen (Versuch $i/3) – neuer Versuch"; sleep 20
          done; exit 1
      # the app is built here from tools/ (never taken from a hand-made index.html) and must start without any script error
      - name: App bauen
        run: |
          npm install -g esbuild@0.24.0 --no-audit --no-fund --loglevel=error || true
          ESBUILD=$(command -v esbuild || true) python tools/make_site.py
          mkdir -p /tmp/site && cp index.html version.txt /tmp/site/
      - name: App startet ohne Fehler
        run: python tests/boot_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: /tmp/site/
      # alle Teile laufen, auch wenn einer fehlschlägt; am Schluss zählt das Gesamtergebnis
      - name: Hintergrund (Dropbox-Aktualisierung, Push, Alarm, Google Kalender)
        id: t1
        continue-on-error: true
        env:
          TESTS_OUT: /tmp/t-backend.json
        run: python tests/test_backend.py
      - name: App (sechs Rollen, Handy und Desktop)
        id: t2
        continue-on-error: true
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          CREW_KEY: ${{ secrets.CREW_KEY }}
          TESTS_OUT: /tmp/t-app.json
        run: python tests/smoke.py
      - name: Funktionen (Suche, Drehplan, Termine, Konto, Push, vCard, offline, Rechte, Sprachen)
        id: t3
        continue-on-error: true
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          CREW_KEY: ${{ secrets.CREW_KEY }}
          TESTS_OUT: /tmp/t-func.json
        run: python tests/func.py
      - name: Sicherheit (Repository, Seite, Verschlüsselung, Worker, eingeschleuster Code)
        id: t4
        continue-on-error: true
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          CREW_KEY: ${{ secrets.CREW_KEY }}
          TESTS_OUT: /tmp/t-sec.json
        run: python tests/security.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-app
          path: /tmp/t-*.json
      - name: Gesamtergebnis
        if: steps.t1.outcome != 'success' || steps.t2.outcome != 'success' || steps.t3.outcome != 'success' || steps.t4.outcome != 'success'
        run: exit 1

  rules:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Werkzeuge
        working-directory: tests
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Firestore-Regeln im Emulator
        working-directory: tests
        env:
          TESTS_OUT: /tmp/t-rules.json
        run: npx firebase emulators:exec --only firestore --project demo-tschugger --config firebase.json "node rules.test.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-rules
          path: /tmp/t-rules.json

  # the Firestore rules go to Firebase automatically – only after the rule tests (emulator) AND the app tests passed
  rules_deploy:
    needs: [changes, test, rules]
    # Freigabe: Settings → Environments → firestore-rules → «Required reviewers» (dann wartet die Übertragung auf die Freigabe)
    environment: firestore-rules
    if: always() && needs.rules.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.changes.outputs.rules == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography==43.0.3 requests==2.32.3
      - name: Firestore-Regeln übertragen
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python tools/deploy_rules.py
      - name: Alarm (E-Mail an Owner über ein Issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R ${{ github.repository }} -t "Firestore-Regeln nicht übertragen (${GITHUB_SHA::7})" -b "Die Regeln haben alle Tests bestanden, konnten aber nicht nach Firebase übertragen werden. In Firebase gelten weiter die bisherigen Regeln. Details ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" -a furtschellas || true

  # results (only check names and ✓/✗) for App-Verwaltung → Log; also when the tests fail.
  # GitHub Pages publishes from the branch main («Deploy from a branch»): this commit of the tested index.html IS the publication.
  results:
    needs: [test, rules]
    # not when a newer push cancelled the tests: missing results would count as «crashed» and raise a false alarm
    if: always() && needs.test.result != 'cancelled' && needs.rules.result != 'cancelled' && (needs.test.result == 'success' || needs.test.result == 'failure' || needs.rules.result == 'success' || needs.rules.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: /tmp/res
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: needs.test.result == 'success' && (needs.rules.result == 'success' || needs.rules.result == 'skipped')
        continue-on-error: true
        with:
          name: site
          path: /tmp/site
      - name: Ins Repository
        run: |
          python3 tests/merge_results.py /tmp/tests.json "Hintergrund=/tmp/res/t-backend.json" "App=/tmp/res/t-app.json" "Funktionen=/tmp/res/t-func.json" "Sicherheit=/tmp/res/t-sec.json" "Firestore-Regeln=/tmp/res/t-rules.json"
          git config user.name "Crew-App Tests"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main && cp /tmp/tests.json tests.json && git add tests.json
            # all tests passed: the tested app goes live (GitHub Pages takes index.html from main)
            msg="Testresultate"
            if [ -f /tmp/site/index.html ]; then cp /tmp/site/index.html /tmp/site/version.txt . && git add index.html version.txt && msg="App veröffentlicht (alle Tests bestanden) · Testresultate"; fi
            git diff --cached --quiet && break
            git commit -q -m "$msg" && git push -q origin HEAD:main && break
            sleep 5
          done
      # tests failed: nothing was published – push to the owners right away and an e-mail (GitHub issue → mail to the owner)
      - name: Alarm bei fehlgeschlagenen Tests
        if: needs.test.result == 'failure' || needs.rules.result == 'failure'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pip install -q cryptography==43.0.3 requests==2.32.3 || true
          python3 tools/test_alarm.py /tmp/tests.json "$RUN_URL" || true
          gh api -X POST repos/${{ github.repository }}/actions/workflows/push.yml/dispatches -f ref=main || true
          body=$(python3 -c "import sys;sys.path.insert(0,'tools');import test_alarm as T;n,s,f=T.message('/tmp/tests.json');print('Die App wurde NICHT veröffentlicht – die laufende App ist unverändert.\n\nFehlgeschlagen ('+str(n)+'):\n'+'\n'.join('- '+x for x in f[:20]))")
          gh issue create -R ${{ github.repository }} -t "Tests fehlgeschlagen – App nicht veröffentlicht (${GITHUB_SHA::7})" -b "$body"$'\n\n'"$RUN_URL" -a furtschellas || gh issue create -R ${{ github.repository }} -t "Tests fehlgeschlagen – App nicht veröffentlicht (${GITHUB_SHA::7})" -b "$body"$'\n\n'"$RUN_URL" || true
      - name: Alarm erledigt (Tests wieder grün)
        if: needs.test.result == 'success' && (needs.rules.result == 'success' || needs.rules.result == 'skipped')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list -R ${{ github.repository }} --state open --search "Tests fehlgeschlagen in:title" --json number -q '.[].number' 2>/dev/null); do
            gh issue close -R ${{ github.repository }} "$n" -c "Tests wieder grün (${GITHUB_SHA::7}) – App veröffentlicht." || true
          done
