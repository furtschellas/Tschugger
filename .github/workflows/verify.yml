name: Daten prüfen

# Abgleich App-Daten ↔ Dropbox (Bilder, Szenen, Rollen, Dokumente); von Hand über «Run workflow» – ändert nichts
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography==43.0.3 requests==2.32.3 boto3==1.35.54
      - name: Abgleich
        env:
          CREW_KEY: ${{ secrets.CREW_KEY }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_ROOT: ${{ vars.DROPBOX_ROOT }}
        run: python tools/verify_data.py
