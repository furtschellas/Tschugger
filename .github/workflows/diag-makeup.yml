name: Diagnose Maske (einmalig)

# einmalig von Hand: nur Zahlen, keine Namen
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography==43.0.3 requests==2.32.3
      - name: Ausführen
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python tools/diag_makeup.py
