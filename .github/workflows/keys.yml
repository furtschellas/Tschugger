name: Schlüssel wechseln

# von Hand: Actions → «Schlüssel wechseln» → Run workflow. Braucht das Secret FIREBASE_SA (Dienstkonto).
# nachts automatisch: wurde seit dem letzten Wechsel jemand entfernt, gibt es einen neuen Crew-Schlüssel
on:
  schedule:
    - cron: "23 1 * * *"   # 03:23 Schweizer Sommerzeit – niemand arbeitet in der App
  workflow_dispatch:
    inputs:
      what:
        description: "vapid = neuer Push-Schlüssel · crew = neuer Crew-Schlüssel (alles wird neu verschlüsselt)"
        type: choice
        options: [vapid, crew]
        default: vapid

permissions:
  contents: write
  actions: read

# eigene Gruppe: in der Gruppe der Dropbox-Aktualisierung wurde ein wartender Wechsel vom nächsten Aufruf gestrichen.
# Nie gleichzeitig mit ihr: der Wechsel wartet zuerst, bis keine Aktualisierung mehr läuft, und während des Wechsels
# (secret/keynext gesetzt) überspringt die Aktualisierung sich selbst
concurrency:
  group: keys
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Warten, bis keine Dropbox-Aktualisierung läuft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/dropbox-update.yml/runs?status=in_progress&per_page=5" -q '.total_count' 2>/dev/null || echo 0)
            q=$(gh api "repos/${{ github.repository }}/actions/workflows/dropbox-update.yml/runs?status=queued&per_page=5" -q '.total_count' 2>/dev/null || echo 0)
            [ "$n" = "0" ] && [ "$q" = "0" ] && exit 0
            sleep 20
          done
          echo "::warning::Dropbox-Aktualisierung läuft noch nach 20 Minuten – Wechsel startet trotzdem (die Aktualisierung überspringt sich während des Wechsels)"
      - uses: actions/checkout@v4
        with:
          ref: main   # always the newest data (a waiting run would otherwise re-encrypt an old state)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography==43.0.3 requests==2.32.3 boto3==1.35.54
      - name: Wechsel nötig?
        id: due
        if: github.event_name == 'schedule'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python tools/rotate.py due
      - name: Schlüssel wechseln
        id: rot
        if: github.event_name == 'workflow_dispatch' || steps.due.outputs.due == 'true'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          CREW_KEY: ${{ secrets.CREW_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: python tools/rotate.py ${{ github.event.inputs.what || 'crew' }}
      - name: Veröffentlichen
        if: success() && steps.rot.outcome == 'success' && (github.event.inputs.what || 'crew') == 'crew'
        run: |
          git config user.name "Crew-App Aktualisierung"
          git config user.email "actions@users.noreply.github.com"
          git add -A data.enc.json script.enc.json media.enc.json contacts.enc.json stamp.json tools/*.enc.json
          git ls-files --error-unmatch blk >/dev/null 2>&1 && git add -A blk || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Neuer Crew-Schlüssel: Daten neu verschlüsselt"
          git config http.postBuffer 524288000
          for i in 1 2 3; do git pull -q --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
      # the key is switched only now: if publishing failed, the data in the repository still matches the old key and the next run continues
      - name: Schlüssel aktivieren
        if: success() && steps.rot.outcome == 'success' && (github.event.inputs.what || 'crew') == 'crew'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python tools/rotate.py finalize
