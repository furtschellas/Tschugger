}

@media (max-width:600px){:root{--ubw:30px;--ubh:24px;--ubf:11px}}
html body .stripwrap>.pub.dpub button{width:var(--ubw)!important;min-width:var(--ubw);height:var(--ubh)!important;min-height:var(--ubh)!important;border-radius:6px!important;font-size:var(--ubf);line-height:1;padding:0!important;letter-spacing:-.02em}

/* phone: the day row from the very left edge over the whole screen width, no gaps */
@media (max-width:600px){html body .stripwrap{margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-left:env(safe-area-inset-left,0px);padding-right:0}.stripwrap>.pub{padding-left:3px}.stripwrap>.strip.in{padding-right:max(6px,env(safe-area-inset-right,0px))}}

.fldl{display:grid;gap:8px;margin-top:10px}
