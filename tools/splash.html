<script>/* stability: errors are collected (reported to the owners without any data), the last version that started without
   errors is kept on the device, and if this version does not start, the page switches to that one (once per session) */

window.addEventListener("unhandledrejection",function(e){try{var r=e.reason;__ERRS.push({m:String(r&&r.message||r||"").slice(0,200),f:"promise",l:0,t:Date.now()})}catch(_){}});
window.addEventListener("load",function(){setTimeout(function(){var ok=typeof render==="function"&&typeof VIEWS==="object"&&window.__APPOK;
  var safe=/[?&]safe=/.test(location.search);if(safe)try{history.replaceState(null,"",location.pathname+location.hash)}catch(_){}
  if(ok&&!safe)try{sessionStorage.removeItem("safeTry")}catch(_){}
  if(!ok&&!safe){try{if(!sessionStorage.getItem("safeTry")){sessionStorage.setItem("safeTry","1");location.replace(location.pathname+"?safe=1"+location.hash);return}}catch(_){}}
  /* good: no error while starting and the page drew itself → keep this version as the fallback */
  if(ok&&!safe&&!__ERRS.length){var c=navigator.serviceWorker&&navigator.serviceWorker.controller;if(c)try{c.postMessage({good:1,v:window.APPVER})}catch(_){}}},5000)});
</script>
