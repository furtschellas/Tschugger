<div id="splash" aria-hidden="true"><div class="spw"><svg class="spr" viewBox="0 0 160 160"><circle cx="80" cy="80" r="74" class="spt"/><circle cx="80" cy="80" r="74" class="spp" id="splp"/></svg><img src="clap.svg" alt="" width="119" height="119"></div><div class="spv" id="spv"></div></div>
<style>#splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#110d1c;transition:opacity .18s}#splash.out{opacity:0;pointer-events:none}
#splash{flex-direction:column;gap:18px}#splash .spv{min-height:3.9em;text-align:center;font:500 12px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.04em;color:rgba(255,255,255,.62)}#splash .spv b{color:#ff2e8a;font-weight:700}
#splash .spw{position:relative;width:160px;height:160px;display:flex;align-items:center;justify-content:center}#splash img{width:119px;height:119px;border-radius:50%}
#splash .spr{position:absolute;inset:0;transform:rotate(-90deg)}#splash circle{fill:none;stroke-width:5}#splash .spt{stroke:rgba(255,255,255,.12)}
#splash .spp{stroke:#ff2e8a;stroke-linecap:round;stroke-dasharray:465;stroke-dashoffset:465;transition:stroke-dashoffset .25s}
@media (prefers-color-scheme:light){html:not([data-theme="dark"]) #splash{background:#f6f2ea}html:not([data-theme="dark"]) #splash .spv{color:rgba(0,0,0,.55)}}</style>
<script>/* start screen: the logo (about the size of a five-franc coin); the ring shows how far the app has loaded and the page
   appears the moment it is ready – also on reload. It never blocks the app: at the latest after 8 s it disappears. */
(function(){var el=document.getElementById("splash"),c=document.getElementById("splp"),t0=Date.now(),cur=0,done=false;
  function set(p){if(p>cur){cur=p;c.style.strokeDashoffset=String(465*(1-p/100))}}
  function end(){if(done)return;done=true;set(100);setTimeout(function(){el.classList.add("out");setTimeout(function(){el.remove()},200)},120)}
  /* below the logo (only when the app starts, not on a reload): schedule version, script version, app version and © */
  var rel=false;try{var nv=performance.getEntriesByType("navigation")[0];rel=nv&&nv.type==="reload"}catch(e){}
  var tv=document.getElementById("spv"),SCR={de:"Drehbuch",fr:"Scénario",it:"Sceneggiatura",en:"Script"},lg="de";try{lg=localStorage.getItem("lang")||"de"}catch(e){}
  function txt(){if(rel||!tv)return;var m=null;try{m=typeof S!=="undefined"&&S&&S.meta}catch(e){}
    var h=(m&&m.scheduleVersion?esc2(m.scheduleVersion)+"<br>":"")+(m&&m.scriptVersion?(SCR[lg]||SCR.en)+" "+esc2(m.scriptVersion)+"<br>":"")+"App __APP_VER__ · © <b>MrK</b> 2026";if(tv.innerHTML!==h)tv.innerHTML=h}
  function esc2(x){return String(x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function st(){if(done)return;txt();var p=10;try{if(document.readyState!=="loading")p=30;if(window.FB)p=50;
      var g=document.getElementById("gate");if(g&&!g.hidden&&g.offsetParent!==null&&Date.now()-t0>300)return end();
      if(typeof S!=="undefined"&&S){if(typeof ME!=="undefined"&&ME)p=75;if(S.loaded&&(S.days||[]).length){var v=document.getElementById("view");if(v&&v.children.length)return end()}}}catch(e){}
    set(Math.max(p,Math.min(90,cur+1)));if(Date.now()-t0>8000)return end();setTimeout(st,80)}
  window.splashEnd=end;st()})();</script>
