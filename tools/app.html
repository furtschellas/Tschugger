/* calendar entry for one PREP appointment: an .ics file the phone opens straight in its calendar app */
function zurichUTC(date,hm){
  const [y,mo,d]=date.split("-").map(Number),[h,mi]=hm.split(":").map(Number);
  let ts=Date.UTC(y,mo-1,d,h,mi)-2*3600e3;
  const want=Date.UTC(y,mo-1,d,h,mi);
  for(let n=0;n<2;n++){const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Zurich",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date(ts));
    const g=t=>+(p.find(x=>x.type===t)||{}).value;ts+=want-Date.UTC(g("year"),g("month")-1,g("day"),g("hour"),g("minute"))}   /* whole date compared: also right on the 1st of a month */
  return new Date(ts);
}
function icsDate(dt){return dt.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"")}
function icsEsc(t){return String(t||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1")}
/* fold long lines at 75 bytes (UTF-8) without splitting a character */
function icsFold(l){const enc=new TextEncoder(),out=[];let cur="",n=0;for(const ch of l){const b=enc.encode(ch).length;if(n+b>(out.length?74:75)){out.push(cur);cur="";n=0}cur+=ch;n+=b}out.push(cur);return out.join("\r\n ")}
function makeICS(date,i){
  const tm=/^\d{1,2}:\d{2}$/.test(i.t||""),te=/^\d{1,2}:\d{2}$/.test(i.end||"");
  const L2=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Tschugger Crew//PREP//DE","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT",
    "UID:prep-"+date+"-"+String(i.n||"").replace(/\W+/g,"").slice(0,30)+"-"+(i.t||"").replace(/\W/g,"")+"@tschugger-crew","DTSTAMP:"+icsDate(new Date())];
  if(tm){const st=zurichUTC(date,i.t);let en=te?zurichUTC(date,i.end):new Date(st.getTime()+3600e3);if(en<=st)en=new Date(en.getTime()+864e5); /* night shoot: end after midnight */L2.push("DTSTART:"+icsDate(st),"DTEND:"+icsDate(en))}
  else{const d0=date.replace(/-/g,""),nx=new Date(date+"T12:00:00Z");nx.setUTCDate(nx.getUTCDate()+1);L2.push("DTSTART;VALUE=DATE:"+d0,"DTEND;VALUE=DATE:"+nx.toISOString().slice(0,10).replace(/-/g,""))}
  const desc=[i.t&&!tm?i.t:"",i.crew?"Crew: "+i.crew:"",i.cast?"Cast: "+i.cast:"",i.map||"","TSCHUGGER Tigerblood – Prep"].filter(Boolean).join("\n");
  L2.push("SUMMARY:"+icsEsc((tm?"":"("+(i.t||"TBA")+") ")+(i.n||"Prep")),i.where?"LOCATION:"+icsEsc(i.where):"","DESCRIPTION:"+icsEsc(desc),i.map?"URL:"+i.map:"");
  if(tm)L2.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(i.n||"Prep"),"TRIGGER:-PT30M","END:VALARM");
  L2.push("END:VEVENT","END:VCALENDAR");
  return L2.filter(Boolean).map(icsFold).join("\r\n")+"\r\n";
}
/* e-mail distribution list for one PREP appointment: names → addresses from the crew list and the app users */

function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}

function findPerson(name,people){
  const k=nmk(name);if(!k)return null;
  let hit=people.find(p=>p.k===k);if(hit)return hit;
  const [f,...r]=k.split(" "),l=r.join(" ");
  const ok=p=>{const [pf,...pr]=p.k.split(" ");const pl=pr.join(" ");return (pf===f&&lev(pl,l)<=1)||(pl===l&&(lev(pf,f)<=2||pf.startsWith(f)||f.startsWith(pf)))};

function groupPeople(term,people){

  if(/^(everyone|all crew|crew cast|crew and cast|alle)( |$)/.test(t)||/all crew who/.test(t))return {all:true,list:people.filter(p=>p.src!=="user")};
  const W=w=>new RegExp("(^| )("+w+")( |$)");
  const dm=[[W("art dep|art department|art dept|ausstattung|szenenbild"),/ausstattung|art/],[W("licht|light|lighting|grip|grips"),/licht|grip/],[W("kamera|camera"),/kamera/],[W("kostum|kostume|kostumbild|costume|costumes|wardrobe"),/kost/],[W("maske|make up|makeup|hmu|hair make up"),/mask/],[W("ton|sound"),/^ton/]];

function saveVcf(v,name,file){

  sec(L("Drehtage"),R.day,r=>add(r,'<b>'+esc(r.d.label)+'</b> · '+esc(fmtDate(r.d.date)),esc([r.d.hours,dayPlaces(r.d).join(", "),r.d.kind==="shoot"?(r.sc1+r.sc2+(r.sc3||0))+" "+L("Szenen")+(r.sc2?" · 2nd Unit":"")+(r.sc3?" · 3rd Unit":""):(r.d.kind==="off"?L("Drehfrei"):(TX(r.d,"info")||L("Reisetag")))].filter(Boolean).join(" · "))));
  const rIds=S.gm==="role"?rolesFor(terms).map(r=>r.id):[];const castNm=(S.meta&&S.meta.cast)||{};
  sec(cap(L("Szenen")),R.sc,r=>add(r,'<b>'+hl(r.it.sc,terms)+'</b> · '+hl(r.it.set||"",terms),esc((r.d.short||r.d.label)+' '+fmtDate(r.d.date).slice(0,-5)+' · '+(r.it.t||"")+(r.u==="2"?' · 2nd Unit':r.u==="3"?' · 3rd Unit':''))+(S.gm==="role"?'<br>'+arr(r.it.cast).filter(c=>rIds.includes(String(c))).map(c=>'<mark>'+esc(castNm[c]||c)+'</mark>').join(", "):'')+'<br>'+hl(TX(r.it,"d"),terms)+'<br>'+hl(r.ad||"",terms)));
  sec("Locations",R.loc,r=>add(r,hl(r.g.title,terms),hl(r.g.s5?[((S.meta&&S.meta.locCfg||{}).s5||{}).village,L("Mehrere Adressen")].filter(Boolean).join(", "):[r.g.venue,r.g.address].filter(Boolean).join(", "),terms)));
  sec("Crew",R.crew,r=>add(r,hl(r.p.name,terms),hl([TX(r.p,"role"),TX(r.dep,"dept"),vok("phone")?r.p.phone:""].filter(Boolean).join(" · "),terms)));  /* phone only with the right to see it */
  sec("Callsheet",R.dispo,r=>add(r,esc((r.x.label||"Callsheet")+' · '+fmtDate(r.x.date)),'Callsheet'));
  sec("Info",R.info,r=>add(r,hl(r.it.name,terms),hl([TX(r.c,"cat"),r.it.address].filter(Boolean).join(" · "),terms)));
  box.innerHTML=n?h:'<p class="shint">'+L('Nichts gefunden für')+' «'+esc(q)+'».</p>';
}
function openSearch(){$("#search").hidden=false;document.body.style.overflow="hidden";const i=$("#gq");i.focus();i.select();renderSearch()}
function closeSearch(){$("#search").hidden=true;document.body.style.overflow=""}

/* every pop-up: × at the top right, Esc closes the topmost one (the first-start profile form stays until it is filled in) */

  const b=document.createElement("button");b.type="button";b.className="xclose";b.setAttribute("aria-label",L("Schliessen"));b.title=L("Schliessen");b.textContent="×";b.addEventListener("click",()=>closeDialog(d));box.prepend(b)}
new MutationObserver(()=>{for(const d of document.querySelectorAll(".a2hs:not([hidden])"))addX(d)}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["hidden"]});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;const ds=[...document.querySelectorAll(".a2hs:not([hidden])")];if(ds.length){e.preventDefault();closeDialog(ds[ds.length-1])}});

$("#gq").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();clearTimeout(gqT);renderSearch();const f=document.querySelector("#gres [data-sr]");if(f)f.click()}});
$("#gmodes").addEventListener("click",e=>{const b=e.target.closest("[data-gm]");if(!b)return;S.gm=b.dataset.gm;try{localStorage.setItem("gm",S.gm)}catch(_){}renderSearch();$("#gq").focus()});
$("#gres").addEventListener("click",e=>{const pk=e.target.closest("[data-gpick]");if(pk){$("#gq").value=pk.dataset.gpick;renderSearch();return}
  const b=e.target.closest("[data-sr]");if(!b)return;const r=SR[+b.dataset.sr];if(!r)return;LASTQ=$("#gq").value;closeSearch();
  let scrollSel=null;
  if(r.k==="day"){S.tab="plan";S.day=r.d.id;const qv=nrm(LASTQ);S.pu=(/\b(3rd|3u|third|dritte|3\.)\b|3rd ?unit|unit ?3/.test(qv)&&hasU(r.d,"3"))?{"1":false,"2":false,"3":true}:(/\b(2nd|2u|second|zweite|2\.)\b|2nd ?unit|unit ?2/.test(qv)&&hasU(r.d,"2"))?{"1":false,"2":true,"3":false}:{"1":true,"2":false,"3":false}}

  else if(r.k==="crew"){S.tab="crew";S.q=r.p.name}
  else if(r.k==="dispo"){S.tab="dispo";S.dday=r.x.date}

  if(r.k==="sc"){const want=norm(r.it.sc);const el=[...document.querySelectorAll(".sc .scn")].find(x=>norm(x.textContent)===want);if(el){el.closest(".sc").scrollIntoView({block:"center"});el.closest(".sc").classList.add("hit");setTimeout(()=>el.closest(".sc").classList.remove("hit"),1800)}}
  if(scrollSel){const el=document.querySelector(scrollSel);if(el)el.scrollIntoView({block:"start"})}

/* ---------- data ---------- */
const arr=x=>Array.isArray(x)?x:[];
function cleanDay(d){
  const o=Object.assign({},d);o.items=arr(o.items).filter(x=>x&&typeof x==="object");o.notes=arr(o.notes).filter(x=>typeof x==="string");for(const l of ["fr","en"])if(o["notes_"+l]!==undefined)o["notes_"+l]=arr(o["notes_"+l]).filter(x=>typeof x==="string");
  for(const k of ["unit2","unit3"]){if(o[k]&&typeof o[k]==="object")o[k]=Object.assign({},o[k],{items:arr(o[k].items).filter(x=>x&&typeof x==="object"),notes:arr(o[k].notes)});else delete o[k];}
  return o;
}
const CLEAN={
  days:list=>list.filter(d=>d&&typeof d.date==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(d.date)).map(cleanDay).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0),
  crew:list=>list.map(c=>Object.assign({},c,{people:arr(c.people).filter(p=>p&&typeof p==="object").map(p=>p.phone!=null&&typeof p.phone!=="string"?Object.assign({},p,{phone:String(p.phone)}):p)})),
  locs:list=>list.map(l=>Object.assign({},l,{sets:arr(l.sets).map(x=>Object.assign({},x,{scenes:arr(x.scenes).map(String)}))})),
  places:list=>list.map(c=>Object.assign({},c,{items:arr(c.items)})),
  /* callsheets come from a language model: lists always lists, phone numbers always text (else the whole view breaks) */
  dispos:list=>list.filter(x=>x&&typeof x.date==="string").map(x=>Object.assign({},x,{scenes:arr(x.scenes).filter(o=>o&&typeof o==="object").map(sc=>Object.assign({},sc,{cast:arr(sc.cast)})),
    locations:arr(x.locations).filter(o=>o&&typeof o==="object"),
    contacts:arr(x.contacts).filter(o=>o&&typeof o==="object").map(c=>Object.assign({},c,{phone:c.phone==null?"":String(c.phone)})),
    calls:arr(x.calls).filter(o=>o&&typeof o==="object"),meals:arr(x.meals).filter(o=>o&&typeof o==="object"),cast:arr(x.cast).filter(o=>o&&typeof o==="object").map(c=>Object.assign({},c,{phone:c.phone==null?"":String(c.phone)})),
    hospital:x.hospital&&typeof x.hospital==="object"?Object.assign({},x.hospital,{phone:x.hospital.phone==null?"":String(x.hospital.phone)}):x.hospital})),
  prepro:list=>list.filter(d=>d&&typeof d.date==="string").map(d=>Object.assign({},d,{items:arr(d.items).filter(x=>x&&typeof x==="object"),notes:arr(d.notes).filter(x=>typeof x==="string")})).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:String(a.t||"").localeCompare(String(b.t||""))),
};
/* last data kept in this browser so the app opens instantly; the live database replaces it a moment later */
const CACHE_KEY="crewcache:v1";let cacheT=null;
function saveCache(){clearTimeout(cacheT);cacheT=setTimeout(()=>{try{localStorage.setItem(CACHE_KEY,JSON.stringify({meta:S.meta,days:S.days,crew:S.crew,locs:S.locs,places:S.places,dispos:S.dispos,prepro:S.prepro}))}catch(_){}},1500)}
function loadCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");if(!c||!Array.isArray(c.days))return false;S.meta=c.meta||null;for(const k of ["days","crew","locs","places","dispos","prepro"])S[k]=(CLEAN[k]||(x=>x))(arr(c[k]));MEMO.clear();return true}catch(_){return false}}
/* several snapshots arrive together on start: draw once per frame */
let RQ=0;function scheduleRender(){if(RQ)return;RQ=1;const go=()=>{if(!RQ)return;RQ=0;render()};requestAnimationFrame(go);setTimeout(go,120)}
let MSGT=null;function showMsg(text,ms){const m=$("#refmsg");m.hidden=false;m.textContent=text;clearTimeout(MSGT);MSGT=ms?setTimeout(()=>{m.hidden=true},ms):null} /* a newer message is not hidden by the timer of an older one */

applyStatic();
loadCache();
render();
</script>
