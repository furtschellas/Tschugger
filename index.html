const escRe=t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
/* query normalising shared by both searches: today/tomorrow, D5/Day 5/#5, dates as d.m. */
function normQ(q){
  let qq=nrm(q).replace(/[,;]/g," ").trim();
  const iso=d=>d.getDate()+"."+(d.getMonth()+1)+".";
  const now=new Date(),tmr=new Date(Date.now()+864e5);
  qq=qq.replace(/\b(heute|today|aujourd'?hui|oggi)\b/g,iso(now)).replace(/\b(morgen|tomorrow|demain|domani)\b/g,iso(tmr));
  qq=qq.replace(/\b(drehtag|day|tag|dt|jour|giorno|j)\s*#?\s*(\d{1,2})\b/g,"d$2").replace(/#(\d{1,2})\b/g,"d$1");
  qq=qq.replace(/\b(\d{1,2})[./](\d{1,2})\.?(?:\d{2,4})?\b/g,(m,a,b)=>(+a)+"."+(+b)+".");
  return qq;
}
const WDALL=[["sonntag","sunday","dimanche","domenica"],["montag","monday","lundi","lunedi"],["dienstag","tuesday","mardi","martedi"],["mittwoch","wednesday","mercredi","mercoledi"],["donnerstag","thursday","jeudi","giovedi"],["freitag","friday","vendredi","venerdi"],["samstag","saturday","samedi","sabato"]];
function dayKeys(d){const x=new Date(d.date+"T12:00:00");return nrm([d.short,d.label,x.getDate()+"."+(x.getMonth()+1)+".",pad2(x.getDate())+"."+pad2(x.getMonth()+1)+".",WDALL[x.getDay()].join(" "),WD[x.getDay()]].join(" "))}
/* roles (characters of the cast list) with the names they go by in the script */
const GENW=new Set(["mafioso","teenager","aunt","tante","dr","neighbour","nachbar","fisherman","fischer","karate","the","der","die"]);
function roleList(){return memo("roles",()=>{const c=(S.meta&&S.meta.cast)||{};
  return Object.keys(c).sort((a,b)=>(parseInt(a,10)||0)-(parseInt(b,10)||0)).map(id=>{const name=String(c[id]||"");const al=new Set();
    for(const part of fold(name).split("/").map(x=>x.trim()).filter(Boolean)){al.add(part.replace(/\./g,""));const w=part.replace(/\./g,"").split(/\s+/).filter(Boolean);if(w.length>1){const last=w[w.length-1];if(last.length>=3&&!GENW.has(last))al.add(last)}}
    return {id:String(id),name,al:[...al].filter(x=>x.length>=2)}})})}
function rolesFor(terms){return roleList().filter(r=>terms.every(t=>r.id===t||fold(r.name).includes(t)||r.al.some(a=>a.includes(t))))}
function planRoles(sc){const s=new Set();for(const h of (schedIndex()[norm(sc)]||[]))for(const c of arr(h.it.cast))s.add(String(c));return s}
/* who appears in each script scene: sp = the role speaks (dialogue heading in capitals), mt = the role is only mentioned in the text */
const SPK=/^[ \t]*([A-ZÄÖÜÉÈÀ][A-ZÄÖÜÉÈÀ0-9 .'’\-\/]{1,40}?)(?:\s*\([^)]*\))?[ \t]*$/gm;
function scriptRoles(){return memo("scroles:"+(SCRIPT?SCRIPT.length:0),()=>{const R=roleList().map(r=>({id:r.id,al:r.al,re:r.al.map(a=>new RegExp("(^|[^a-z0-9])"+escRe(a)+"($|[^a-z0-9])"))}));const out={};
  for(const x of (SCRIPT||[])){const k=norm(x.sc),o=out[k]||{sp:new Set(),mt:new Set()};const txt=String(x.text||"");
    const spk=[...txt.matchAll(SPK)].map(m=>fold(m[1]).replace(/\./g,"").trim()).filter(n=>n&&!/^(continued|cont|int|ext|i\/e|cut to|fade)/.test(n));
    const t=fold((x.head||"")+"\n"+txt);
    for(const r of R){if(spk.some(n=>r.al.some(a=>n===a||(" "+n+" ").includes(" "+a+" "))))o.sp.add(r.id);else if(r.re.some(re=>re.test(t)))o.mt.add(r.id)}
    out[k]=o}return out})}
const inScript=(o,id)=>!!o&&(o.sp.has(id)||o.mt.has(id));
/* actors (callsheets) → role ids */
function actorRoles(terms){const ids=new Set();const R=roleList();
  for(const dp of S.dispos)for(const c of arr(dp&&dp.cast)){const a=fold(c.actor||"");if(!a||!terms.every(t=>a.includes(t)))continue;
    const no=String(c.no||"").replace(/\D/g,"");if(no&&R.some(r=>r.id===no))ids.add(no);else{const hit=R.find(r=>fold(r.name)===fold(c.role||""));if(hit)ids.add(hit.id)}}
  return [...ids]}
/* role overview: scenes per role in the schedule and in the script, and where they disagree */
function roleOverview(withScript,attr){
  const sched=schedIndex(),sr=withScript&&SCRIPT?scriptRoles():null,R=roleList();if(!R.length)return '<p class="shint">'+esc(L("Keine Rollen in der Besetzungsliste."))+'</p>';
  const plan={};for(const k in sched)for(const h of sched[k])for(const c of arr(h.it.cast)){(plan[c]=plan[c]||new Set()).add(k)}
  return '<div class="rolegrid">'+R.map(r=>{const P=plan[r.id]||new Set();let B=0,diff=0;
    if(sr){for(const k in sr){const o=sr[k],inB=inScript(o,r.id),inP=P.has(k);if(inB)B++;if(sched[k]&&((o.sp.has(r.id)&&!inP)||(inP&&!inB)))diff++}}
    return '<button type="button" class="rolerow" '+attr+'="'+esc(r.name)+'"><span class="rn"><i>'+esc(r.id)+'</i>'+esc(r.name)+'</span><span class="rc">'+esc(L("Drehplan"))+' '+P.size+(sr?' · '+esc(L("Drehbuch"))+' '+B:'')+(diff?' · <b class="rdiff">⚠ '+diff+'</b>':'')+'</span></button>'}).join("")+'</div>'+(sr?'<p class="shint">⚠ = '+esc(L("Geplante Szenen, in denen die Rolle laut Drehbuch spricht, aber nicht im Drehplan steht – oder im Drehplan steht, im Drehbuch aber nicht vorkommt."))+'</p>':'');
}
function roleBadges(sc,ids){const P=planRoles(sc),o=SCRIPT?(scriptRoles()[norm(sc)]||{sp:new Set(),mt:new Set()}):null,planned=(schedIndex()[norm(sc)]||[]).length>0,R=roleList();
  return '<span class="rbadges">'+ids.map(id=>{const r=R.find(x=>x.id===id);if(!r)return"";const inP=P.has(id),sp=o?o.sp.has(id):null,mt=o?o.mt.has(id):null;
    const st=!planned?(sp?L("spricht im Drehbuch"):mt?L("erwähnt im Drehbuch"):""):o===null?(inP?L("im Drehplan"):""):inP&&(sp||mt)?"✓ "+L("Drehplan und Drehbuch"):inP?"⚠ "+L("nur im Drehplan"):sp?"⚠ "+L("spricht im Drehbuch, fehlt im Drehplan"):mt?L("nur erwähnt, nicht im Drehplan"):"";
    return st?'<span class="rbadge'+(/⚠/.test(st)?' warn':'')+'"><b>'+esc(r.name)+'</b> '+esc(st)+'</span>':""}).join("")+'</span>'}
/* ---------- global search ---------- */
const nrm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function hl(text,terms){let h=esc(text);for(const t of terms){if(!t)continue;const re=new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");h=h.replace(re,"<mark>$1</mark>")}return h}
function searchAll(q,mode){
  mode=mode||"all";const M=k=>mode==="all"||mode===k;
  const qq=normQ(q);
  const terms=qq.split(/\s+/).filter(Boolean);if(!terms.length)return null;
  const isNum=t=>/^\d+[a-z]*$/.test(t)&&!/^\d+(st|nd|rd|th)$/.test(t);
  const digits=x=>String(x||"").replace(/\D/g,"");
  const phoneVars=ph=>{const d=digits(ph);if(!d)return "";const loc=d.startsWith("41")?"0"+d.slice(2):d;return d+" "+loc};
  const dshort=d=>{const x=new Date(d.date+"T12:00:00");return x.getDate()+"."+(x.getMonth()+1)+". "+String(x.getDate()).padStart(2,"0")+"."+String(x.getMonth()+1).padStart(2,"0")+". "+WD[x.getDay()]};
  const cast=(S.meta&&S.meta.cast)||{};
  /* text terms: substring anywhere; numeric terms: only scene numbers, day codes, dates, phone numbers */
  const qd=terms.every(t=>/^\+?\d+$/.test(t))?terms.join("").replace(/\D/g,""):"";
  const match=(text,nums,phone)=>{const T=nrm(text),N=nrm(nums);if(phone&&qd.length>=3&&N.replace(/\s+/g," ").split(" ").some(w=>w.includes(qd)))return true;return terms.every(t=>isNum(t)?N.split(/\s+/).some(w=>w.startsWith(t)):(T.includes(t)||N.includes(t)))};
  const R={day:[],sc:[],loc:[],crew:[],dispo:[],info:[]};
  const WDL=[["sonntag","sunday","dimanche","domenica"],["montag","monday","lundi","lunedi"],["dienstag","tuesday","mardi","martedi"],["mittwoch","wednesday","mercredi","mercoledi"],["donnerstag","thursday","jeudi","giovedi"],["freitag","friday","vendredi","venerdi"],["samstag","saturday","samedi","sabato"]];
  /* only areas the person may see (Drehplan, Locations, Crew, Callsheet) */
  const okPlan=vok("plan"),okLoc=true,okCrew=vok("crew"),okDispo=vok("dispo"),okPh=vok("phone"),okEm=vok("email");
  for(const d of (okPlan?S.days:[])){if(!M("day")&&mode!=="text")break;
    const x=new Date(d.date+"T12:00:00");
    const sc1=(d.items||[]).filter(i=>i.sc).length,sc2=((d.unit2&&d.unit2.items)||[]).filter(i=>i.sc).length,sc3=((d.unit3&&d.unit3.items)||[]).filter(i=>i.sc).length;
    const kindw=d.kind==="shoot"?"drehtag shooting day tournage riprese":d.kind==="off"?"drehfrei frei day off off-day libre libero":"reise reisetag travel voyage viaggio";
    const text=[d.label,d.short,kindw,WDL[x.getDay()].join(" "),WD[x.getDay()],dshort(d),(d.notes||[]).join(" "),TXA(d,"notes").join(" "),d.info,TX(d,"info"),dayPlaces(d).join(" "),sc2?"2nd unit":"",sc3?"3rd unit":"",sc1?"1st unit":""].join(" ");
    if(mode==="text"?terms.every(t=>nrm([(d.notes||[]).join(" "),TXA(d,"notes").join(" "),d.info,TX(d,"info")].join(" ")).includes(t)):match(text,nrm(d.short||"")+" "+dshort(d)))R.day.push({k:"day",d,sc1,sc2});
  }
  for(const d of (okPlan?S.days:[]))for(const [u,list] of unitLists(d))for(const it of list){
    if(!it.sc)continue;if(!unitsOn().includes(u))continue;const ad=addrForItem(it);
    const sc=nrm(it.sc).replace(/\s+/g,"");
    const text=[it.set,it.d,it.d_de,it.d_fr,ad,it.loc,(it.cast||[]).map(c=>cast[c]||"").join(" "),d.label,d.short,UNAME[u]+" unit","szene scene"].join(" ");
    const nums=[sc,nrm(it.sc),(it.cast||[]).join(" "),nrm(d.short||""),dshort(d)].join(" ");
    if(mode==="day"||mode==="person")continue;
    if(mode==="all"&&!match(text,nums))continue;
    if(mode==="sc"&&!terms.every(t=>sc.startsWith(t.replace(/\s+/g,""))))continue;
    if(mode==="role"){const ids=rolesFor(terms).map(r=>r.id);if(!ids.length||!arr(it.cast).some(c=>ids.includes(String(c))))continue}
    if(mode==="loc"&&!terms.every(t=>nrm([it.set,it.loc,ad].join(" ")).includes(t)))continue;
    if(mode==="text"&&!terms.every(t=>nrm([it.d,it.d_de,it.d_fr,it.d_it].join(" ")).includes(t)))continue;
    let score=0;for(const t of terms){if(sc===t)score+=100;else if(sc.startsWith(t))score+=40}
    R.sc.push({k:"sc",d,u,it,ad,score});
  }
  R.sc.sort((x,y)=>y.score-x.score||(x.d.date<y.d.date?-1:x.d.date>y.d.date?1:String(x.it.t).localeCompare(String(y.it.t))));
  for(const g of (M("loc")&&okLoc?groupLocs():[])){
    const text=g.s5?[g.title,...g.parts.map(p=>fullAddr(p.it.loc)+" "+p.it.set)].join(" "):[g.title,g.venue,g.address,...g.items.map(l=>[l.name,l.venue,l.address].join(" "))].join(" ");
    const nums=g.s5?g.parts.map(p=>nrm(p.it.sc).replace(/\s+/g,"")).join(" "):g.items.flatMap(l=>(l.sets||[]).flatMap(x=>x.scenes||[])).map(x=>nrm(x).replace(/\s+/g,"")).join(" ");
    if(match(text,nums+" "+nrm(text).replace(/[^0-9a-z ]/g," ")))R.loc.push({k:"loc",g});
  }
  if(M("person")&&okCrew)for(const dep of S.crew)for(const pp of (dep.people||[]))if(match([pp.name,pp.role,pp.role_fr,pp.role_en,dep.dept,dep.dept_fr,dep.dept_en,okEm?pp.email:"",pp.note].join(" "),okPh?phoneVars(pp.phone):"",true))R.crew.push({k:"crew",p:pp,dep});
  if(mode==="all"&&okDispo)for(const x of S.dispos){const vals=JSON.stringify(x).replace(/"[a-zA-Z]+":/g," ");if(match(vals,nrm(x.label||"")+" "+dshort(x)))R.dispo.push({k:"dispo",x})}

  return {R,terms};
}
let SR=[],LASTQ="";

function loadCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");if(!c||!Array.isArray(c.days))return false;S.meta=c.meta||null;for(const k of ["days","crew","locs","places","dispos","prepro"])S[k]=(CLEAN[k]||(x=>x))(arr(c[k]));MEMO.clear();return true}catch(_){return false}}
/* several snapshots arrive together on start: draw once per frame */

async function reloadAll(db){

 "Mit dem Briefumschlag schickst du sofort eine Push-Nachricht an alle – oder nur an bestimmte Rollen und Abteilungen.":{fr:"Avec l’enveloppe, tu envoies tout de suite une notification à tous – ou seulement à certains rôles et départements.",it:"Con la busta invii subito una notifica a tutti – o solo a certi ruoli e reparti.",en:"With the envelope you instantly send a notification to everyone – or only to certain roles and departments.",hi:"लिफ़ाफ़े से तुरंत सभी को – या केवल चुनी भूमिकाओं और विभागों को – पुश संदेश भेजें।"},

 "Hier wechselst du die Sprache der App – so sieht sie zum Beispiel auf Englisch aus. Mit «Weiter» geht es in deiner Sprache weiter.":{fr:"Ici tu changes la langue de l’app – voici par exemple l’anglais. « Suivant » te ramène à ta langue.",it:"Qui cambi la lingua dell’app – ecco per esempio l’inglese. «Avanti» ti riporta alla tua lingua.",en:"Here you change the app’s language – this is how it looks in another language. “Next” brings back your language.",hi:"यहाँ ऐप की भाषा बदलें – उदाहरण के लिए अंग्रेज़ी में ऐसा दिखता है। «आगे» से आपकी भाषा वापस आती है।"},

 "Wähle, welche Termine in die App kommen und wer sie sieht. Änderungen im Google Kalender (Zeit, Titel, Ort) werden automatisch nachgeführt; dort gelöschte Termine verschwinden aus der App.":{fr:"Choisis les rendez-vous qui vont dans l’app et qui les voit. Les modifications dans Google Agenda (heure, titre, lieu) sont reprises automatiquement ; les rendez-vous supprimés disparaissent de l’app.",it:"Scegli quali appuntamenti entrano nell’app e chi li vede. Le modifiche in Google Calendar (ora, titolo, luogo) vengono riprese automaticamente; gli appuntamenti eliminati spariscono dall’app.",en:"Choose which appointments go into the app and who sees them. Changes in Google Calendar (time, title, place) are followed automatically; appointments deleted there disappear from the app."},

 "Geheime Adresse im iCal-Format einfügen (Google Kalender → Einstellungen des Kalenders → «Privatadresse im iCal-Format»). Die Termine werden alle 10 Minuten gelesen; in «Meine Termine» wählst du, welche in die App kommen.":{fr:"Coller l’adresse secrète au format iCal (Google Agenda → Paramètres de l’agenda → « Adresse privée au format iCal »). Les rendez-vous sont lus toutes les 10 minutes ; dans « Mes rendez-vous », tu choisis lesquels vont dans l’app.",it:"Incolla l’indirizzo segreto in formato iCal (Google Calendar → Impostazioni del calendario → «Indirizzo privato in formato iCal»). Gli appuntamenti vengono letti ogni 10 minuti; in «I miei appuntamenti» scegli quali entrano nell’app.",en:"Paste the secret address in iCal format (Google Calendar → calendar settings → “Secret address in iCal format”). Appointments are read every 10 minutes; in “My appointments” you choose which go into the app."},

 "Vor jeder Veröffentlichung von neuem Code prüft GitHub die Hintergrund-Abläufe, die App mit sechs Rollen auf Handy und Desktop, die Funktionen und die Firestore-Regeln. Schlägt ein Test fehl, wird nicht veröffentlicht.":{fr:"Avant chaque publication de nouveau code, GitHub teste les processus en arrière-plan, l’app avec six rôles sur mobile et ordinateur, les fonctions et les règles Firestore. Si un test échoue, rien n’est publié.",it:"Prima di ogni pubblicazione di nuovo codice GitHub verifica i processi in background, l’app con sei ruoli su telefono e desktop, le funzioni e le regole Firestore. Se un test fallisce, non si pubblica.",en:"Before new code is released, GitHub tests the background jobs, the app with six roles on phone and desktop, the functions and the Firestore rules. If a test fails, nothing is released."},

 "Mit «+ Termin» legst du einen eigenen Termin an und wählst, wer ihn sieht: alle, Rollen, Abteilungen oder einzelne Personen. Er erscheint auch im Drehplan und in der Prep-Planung am jeweiligen Tag.":{fr:"Avec « + Rendez-vous », tu ajoutes ton propre rendez-vous et choisis qui le voit : tous, des rôles, des départements ou des personnes. Il apparaît aussi dans le plan de tournage et le planning de préparation du jour.",it:"Con «+ Appuntamento» aggiungi un tuo appuntamento e scegli chi lo vede: tutti, ruoli, reparti o singole persone. Compare anche nel piano di lavorazione e nella pianificazione prep del giorno.",en:"With “+ Appointment” you add your own appointment and choose who sees it: everyone, roles, departments or individual people. It also shows up in the shooting and prep schedule of that day."},

/* after approval: Firebase sends the person an e-mail with a one-tap sign-in link (needs "E-Mail-Link" sign-in enabled in Firebase);
   if that is not possible, a prepared e-mail opens in the admin's mail app */
async function notifyApproved(em,q){
  const url=location.origin+location.pathname+"?approved=1&em="+encodeURIComponent(em);
  try{
    const {A,auth}=await fb();if(typeof A.sendSignInLinkToEmail!=="function")throw new Error("no email link");
    const keep=auth.languageCode;auth.languageCode=LANG;
    try{await A.sendSignInLinkToEmail(auth,em,{url,handleCodeInApp:true})}finally{auth.languageCode=keep||LANG}
    showMsg(L("E-Mail mit Anmelde-Link gesendet an")+" "+em,6000);return true;
  }catch(err){
    console.warn("mail link",err&&err.code||err);
    location.href=mailto(em,"approved",{vorname:String((q&&q.name)||"").split(/\s+/)[0],name:(q&&q.name)||""});
    return false;
  }
}

async function sendRequest(){
  const n=String(($("#rqn")||{}).value||"").trim(),f=String(($("#rqf")||{}).value||"").trim(),t=String(($("#rqt")||{}).value||"").trim();
  if(n.length<3){REQ.err=L("Bitte Vor- und Nachname angeben.");showGate(AUTHMODE);return}
  try{const {F,db,auth}=await fb();const em=lc(auth.currentUser&&auth.currentUser.email);if(!em)throw new Error("not signed in");
    await F.setDoc(F.doc(db,"requests",em),{name:n.slice(0,80),role:f.slice(0,80),note:t.slice(0,280),at:F.serverTimestamp()});

const VM={at:0,err:"",busy:false};
function vmKey(u){return "vm:"+(u&&u.uid||"")}
function vmStatus(){

async function sendVerify(u,manual){
  if(!u||VM.busy)return;VM.busy=true;VM.err="";if(AUTHMODE==="verify")showGate("verify");
  try{const {A}=await fb();await sendMailSafe(A.sendEmailVerification,u);VM.at=Date.now();try{localStorage.setItem(vmKey(u),String(VM.at))}catch(_){}}
  catch(err){console.error("verify mail",err);VM.err=/too-many/.test(err&&err.code||"")?L("Zu viele Versuche – bitte in ein paar Minuten nochmals."):errText(err)}
  finally{VM.busy=false;if(AUTHMODE==="verify")showGate("verify")}
}
function autoVerify(u){
  let last=0;try{last=+localStorage.getItem(vmKey(u))||0}catch(_){}
  if(!VM.at&&last)VM.at=last;
  if(Date.now()-Math.max(last,VM.at)>600000)sendVerify(u);
}
async function sendMailSafe(fn,target){
  const {auth}=await fb();auth.languageCode=LANG;
  try{return await fn(target,{url:location.origin+location.pathname})}
  catch(err){if(/continue-uri|unauthorized-domain|invalid-dynamic-link|missing-continue/.test(err&&err.code||""))return await fn(target);throw err}
}
async function onGateClick(e){
  const lb=e.target.closest("[data-glang]");if(lb){LANG=lb.dataset.glang;store("lang",LANG);applyStatic();if(FB)FB.auth.languageCode=LANG;showGate(AUTHMODE);render();return}
  const m=e.target.closest("[data-gmode]");if(m){showGate(m.dataset.gmode);return}
  const a=e.target.closest("[data-gact]");if(!a)return;
  const {A,auth}=await fb();
  if(a.dataset.gact==="signout"){REQ={sent:false,err:""};await A.signOut(auth)}
  else if(a.dataset.gact==="resend"){a.disabled=true;await sendVerify(auth.currentUser,true);a.disabled=false}
  else if(a.dataset.gact==="retry"){if(auth.currentUser)afterSignIn(auth.currentUser)}
  else if(a.dataset.gact==="request"){a.disabled=true;await sendRequest()}
  else if(a.dataset.gact==="google"){
    const prov=new A.GoogleAuthProvider();prov.setCustomParameters({prompt:"select_account"});window.__justSignedIn=true;
    if(window.resetViewState)window.resetViewState();
    try{if(isStandalone())await A.signInWithRedirect(auth,prov);else await A.signInWithPopup(auth,prov)}
    catch(err){const c=err.code||"";
      if(/popup-blocked|operation-not-supported|web-storage/.test(c)){try{await A.signInWithRedirect(auth,prov)}catch(e2){gateMsg(errText(e2),true)}}
      else if(/popup-closed|cancelled-popup/.test(c))gateMsg(L("Google-Anmeldung abgebrochen."),true);
      else gateMsg(errText(err),true)}
  }
}

/* the role or the rights of this person were changed: a short welcome with what is new (and what is gone), once */
function roleChanged(prev){if(!prev||!ME)return;const was=prev.a?"admin":(prev.r||""),now=isOwner()?"owner":COADMIN?"admin":(MYROLE||"");
  const pp=new Set(prev.a?(prev.ap||[]):(prev.p||[])),np=new Set(now==="admin"?ADMINPERMS:now==="owner"?PERMS.map(x=>x[0]):MYPERMS);
  const add=[...np].filter(k=>!pp.has(k)),rem=[...pp].filter(k=>!np.has(k));if(was===now&&!add.length&&!rem.length)return;
  /* only once per change, also across devices: the shown state is kept with the synced settings */
  let h=0;for(const ch of now+":"+[...np].sort().join(","))h=(h*31+ch.charCodeAt(0))|0;const sig=(h>>>0).toString(36);
  let seen="";try{seen=localStorage.getItem("rc")||""}catch(_){}if(seen===sig)return;
  store("rc",sig);savePrefs();setTimeout(()=>showRoleChange(now,add,rem),2500)}
function showRoleChange(role,add,rem){if(document.getElementById("rolechg"))return;
  const lbl=k=>{const x=PERMS.find(p=>p[0]===k);return x?L(x[1]):k};
  const rn=role==="owner"?L("Owner"):role==="admin"?L("Admin"):role?((typeof OWN!=="undefined"&&(OWN.roles||[]).find(r=>r.id===role))||{}).name||role.charAt(0).toUpperCase()+role.slice(1):L("Keine Rolle");
  const d=document.createElement("div");d.id="rolechg";d.className="a2hs";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");
  d.innerHTML='<div class="a2box wlbox"><h3>'+esc(L("Deine Rechte wurden geändert"))+'</h3><p>'+esc(L("Deine Rolle"))+': <b>'+esc(rn)+'</b></p>'+
    (add.length?'<p><b>'+esc(L("Neu für dich"))+':</b> '+esc(add.map(lbl).join(", "))+'</p>':'')+(rem.length?'<p><b>'+esc(L("Nicht mehr"))+':</b> '+esc(rem.map(lbl).join(", "))+'</p>':'')+
    '<div class="a2b"><button type="button" class="pri" data-rcok>'+esc(L("OK"))+'</button></div></div>';
  d.addEventListener("click",e=>{if(e.target.closest("[data-rcok]"))d.remove()});
  document.body.appendChild(d);try{render()}catch(_){}}
/* ---- view settings per user: kept on this device and in Firestore (prefs/{uid}), restored on every device and after a restart ---- */
const PREFKEYS=["theme","pv","sv","lv","spt","uf","pu","welcomeAck","push","chat","tour","today","offline","nv"];let PREFT=null,PREFAPPLY=false;
{const _store=store;store=function(k,v){_store(k,v);if(!PREFAPPLY&&PREFKEYS.includes(k)){try{localStorage.setItem("prefsLocalAt",String(Date.now()))}catch(_){}savePrefsSoon()}}}
function savePrefsSoon(){clearTimeout(PREFT);PREFT=setTimeout(savePrefs,1500)}
/* a change made just before closing or reloading is saved right away (before, the older copy online won on the next start) */
const prefsFlush=()=>{if(PREFT){clearTimeout(PREFT);PREFT=null;savePrefs()}};
addEventListener("pagehide",prefsFlush);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")prefsFlush()});
async function savePrefs(){
  if(!ME||!ME.uid)return;const p={};
  try{for(const k of PREFKEYS){const v=localStorage.getItem(k);if(v!==null)p[k]=String(v).slice(0,400)}}catch(_){return}
  try{for(const k of ["rc","scrv"]){const v=localStorage.getItem(k);if(v!==null&&Object.keys(p).length<14)p[k]=v.slice(0,60)}}catch(_){}   /* role-change notice seen (room permitting: the rules allow 16 fields) */
  let lt=0;try{lt=+localStorage.getItem("prefsLocalAt")||0}catch(_){}PREFT=null;
  try{const {F,db}=await fb();await F.setDoc(F.doc(db,"prefs",ME.uid),Object.assign(p,{at:F.serverTimestamp(),lt}))}catch(err){console.warn("prefs",err&&err.code||err)}
}
function applyPrefs(p){
  if(!p||typeof p!=="object")return;PREFAPPLY=true;
  try{
    for(const k of PREFKEYS)if(typeof p[k]==="string")try{localStorage.setItem(k,p[k])}catch(_){}
    for(const k of ["rc","scrv"])if(typeof p[k]==="string")try{localStorage.setItem(k,p[k])}catch(_){}
    const js=k=>{try{return JSON.parse(p[k])}catch(_){return null}};
    for(const [k,o] of [["pv",S.pv],["sv",S.sv],["lv",S.lv]]){const x=js(k);if(x&&typeof x==="object")for(const i in o)if(typeof x[i]==="boolean")o[i]=x[i]}
    for(const k of ["uf","pu"]){const x=js(k);if(x&&typeof x==="object")S[k]=Object.assign({},S[k],...["1","2","3"].filter(u=>typeof x[u]==="boolean").map(u=>({[u]:x[u]})))}
    if(typeof p.spt==="string")SPT=p.spt==="light"||p.spt==="dark"?p.spt:null;
    if(p.theme==="light"||p.theme==="dark")setTheme(p.theme);
  }finally{PREFAPPLY=false}
  if(typeof p.push==="string")pushSyncSoon();
  render();
}
async function loadPrefs(){
  if(!ME||!ME.uid)return;
  try{const {F,db}=await fb();const d=await withTimeout(F.getDoc(F.doc(db,"prefs",ME.uid)),10000,"prefs");
    let lt=0;try{lt=+localStorage.getItem("prefsLocalAt")||0}catch(_){}
    /* settings changed on this device after the copy online was saved: this device wins and is saved */
    if(d.exists()&&!(lt&&(+d.data().lt||0)<lt))applyPrefs(d.data());else savePrefs()}catch(err){console.warn("prefs",err&&err.code||err)}
}

const APPHELP=`So ist die App aufgebaut (unten die Bereiche, oben die Knöpfe):
- Schedule: Drehplan Tag für Tag mit Szenen, Motiven, Units (1st/2nd Unit); Knopf «Script» öffnet die Szene im Drehbuch, Kamera-Knopf zeigt Blocking-Fotos/Filme, Zahlen-Knöpfe öffnen Floorplans (PDF).

- Daten kommen automatisch aus der Dropbox der Produktion.`;
function chatCtx(){
  const out=[APPHELP];const J=x=>JSON.stringify(x,(k,v)=>v===""||v===null||(Array.isArray(v)&&!v.length)||/_(fr|it|en|hi)$/.test(k)?undefined:v);
  /* from yesterday on (past days only as a short list), translations left out – keeps the question fast and cheap */
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10),cur=a=>arr(a).filter(d=>d&&String(d.date||"")>=y);
  try{if(vok("plan")){out.push("DREHPLAN (days, ab gestern): "+J(cur(S.days)));const past=S.days.filter(d=>d&&String(d.date||"")<y);if(past.length)out.push("FRÜHERE DREHTAGE (nur Datum/Titel): "+J(past.map(d=>({date:d.date,label:d.label||d.short,kind:d.kind}))))}}catch(_){}
  try{if(vok("dispo"))out.push("CALLSHEETS (dispos, ab gestern): "+J(cur(S.dispos)))}catch(_){}
  try{if(vok("prep"))out.push("PREP / WEEKLY SCHEDULE (ab gestern): "+J(cur(S.prepro)))}catch(_){}
  try{out.push("LOCATIONS: "+J(S.locs))}catch(_){}
  try{const ph=vok("phone"),em=vok("email");if(vok("crew"))out.push("CREWLISTE: "+J(S.crew.map(g=>Object.assign({},g,{people:arr(g.people).map(p=>{const q=Object.assign({},p);if(!ph){delete q.phone;delete q.tel;delete q.mobile}if(!em)delete q.email;return q})}))))}catch(_){}
  try{if(vok("mycal")&&typeof myIdentity==="function"){const me=myIdentity();if(me)out.push("MEINE TERMINE ("+me.name+"): "+J(myEvents(me).filter(e=>String(e.date||"")>=y).map(e=>({date:e.date,t:e.t,end:e.end,n:e.n,where:e.where,src:e.src}))))}}catch(_){}
  /* «Meine Termine» first after the help, so a cut at the limit takes the least important part */
  const mine=out.findIndex(x=>/^MEINE TERMINE/.test(x));if(mine>1)out.splice(1,0,out.splice(mine,1)[0]);
  return out.join("\n\n").slice(0,55000);
}

    else{pushSave(c);d.remove();if(b.dataset.ph==="no")showMsg(L("Du kannst Push-Nachrichten jederzeit unter «Mein Konto» einschalten."),4000)}});

async function bcLoadRoles(){if(BC.roles)return;BC.roles=[];try{const {F,db}=await fb();const q=await F.getDocs(F.collection(db,"roles"));BC.roles=q.docs.filter(d=>d.id!=="admin").map(d=>({id:d.id,name:String(d.data().name||d.id)})).sort((a,b)=>a.name.localeCompare(b.name,LANG))}catch(_){}render()}
/* SMS: opens the phone's SMS app with the numbers of the recipients (crew list / app profiles) and the text */
function bcSms(pl){
  const nums=bcSmsNums(pl);
  if(!nums.length){showMsg(L("Keine Telefonnummern für diese Empfänger gefunden."),6000);return}
  const body=encodeURIComponent(pl.title+"\n"+pl.body);
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  location.href=ios?"sms:/open?addresses="+nums.join(",")+"&body="+body:"sms:"+nums.join(",")+"?body="+body;
  showMsg(L("SMS-App geöffnet mit {n} Nummern.").replace("{n}",nums.length),6000);
}
function bcSmsNums(pl){return bcRecips(pl).map(x=>x.ph).filter(x=>x.length>=6)}
/* e-mail: opens the mail app with all chosen recipients in BCC */
function bcMail(pl){const ems=[...new Set(bcRecips(Object.assign({},pl,{withMail:true})).map(x=>x.email).filter(e=>/@/.test(e)))];
  if(!ems.length){showMsg(L("Keine E-Mail-Adressen für diese Empfänger gefunden."),6000);return}
  location.href="mailto:?bcc="+encodeURIComponent(ems.join(","))+"&subject="+encodeURIComponent(pl.title)+"&body="+encodeURIComponent(pl.body);showMsg(L("Mail-App geöffnet mit {n} Adressen.").replace("{n}",ems.length),6000)}
/* recipients with phone number: exactly the persons chosen in the message (all, or roles / departments) */
function bcRecips(pl){
  const roleOfE=e=>{e=lc(e||"");if(ADMINS.includes(e))return "owner";if((ADM.adm||[]).includes(e))return "admin";return (ADM.ur||{})[e]||""};
  const out=[];for(const g of S.crew||[])for(const p of arr(g.people)){const ph=String(p.phone||"").split(/[\/,;]/)[0].replace(/[^\d+]/g,"");if(ph.length<6&&!(pl.withMail&&p.email))continue;
    if(pl.roles||pl.depts){const ok=(pl.depts||[]).includes(g.dept)||(p.email&&(pl.roles||[]).includes(roleOfE(p.email)));if(!ok)continue}if(!out.some(x=>x.ph===ph))out.push({ph,name:p.name||ph,dept:g.dept||"",email:lc(p.email||"")})}
  return out;
}

/* send right away through the Cloudflare Worker; without it the next run picks the message up */
async function bcDeliver(id){
  const {F,db,auth}=await fb();
  if(window.CHATURL){try{const tok=await auth.currentUser.getIdToken();
    const r=await fetch(window.CHATURL.replace(/\/+$/,"")+"/broadcast",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:JSON.stringify({id})});const j=await r.json().catch(()=>({}));
    if(r.ok){if(!j.claimed)try{await F.updateDoc(F.doc(db,"broadcasts",id),{sent:true,n:j.n||0})}catch(_){}
      return L("Gesendet an {n} Geräte.").replace("{n}",j.n||0)+(j.rest||j.fail?" "+L("Die übrigen folgen in wenigen Minuten."):"")}
    if(r.status===403||r.status===409)return L("Nicht gesendet:")+" "+(j.error||r.status);
    await fetch(window.CHATURL.replace(/\/+$/,"")+"/notify",{method:"POST",headers:{Authorization:"Bearer "+tok}}).catch(()=>{});return L("Gesendet – die Nachricht kommt in etwa einer Minute an.")}catch(_){}}
  return L("Gespeichert – die Nachricht geht mit dem nächsten Lauf (spätestens in 15 Minuten) raus.");
}
/* history: every message with date, time, recipients and sender; can be sent again */
async function bcLoadHist(){BC.hist=[];BC.dev=null;BC.devOn=null;try{const {F,db}=await fb();let q;try{q=await F.getDocs(F.query(F.collection(db,"broadcasts"),F.orderBy("at","desc"),F.limit(100)))}catch(_){q=await F.getDocs(F.collection(db,"broadcasts"))}const key=await getDataKey();
  const out=[];for(const d of q.docs){try{const raw=Uint8Array.from(atob(d.data().c),ch=>ch.charCodeAt(0));const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(0,12)},key,raw.slice(12));out.push(Object.assign({id:d.id,sent:d.data().sent,n:d.data().n,done:d.data().done||null},JSON.parse(new TextDecoder().decode(pt))))}catch(_){}}
  BC.hist=out.sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,100)}catch(err){console.warn("bc hist",err&&err.code||err);BC.histErr=String((err&&err.code)||err)}render()}
/* who got it: «done» holds the devices; admins may read the device list (push/…) and see whose device it is */
async function bcLoadDev(){if(BC.dev||!isAdmin())return;BC.dev={};try{const {F,db}=await fb();const key=await getDataKey();const q=await F.getDocs(F.collection(db,"push"));
  for(const d of q.docs){try{const raw=Uint8Array.from(atob(d.data().c),ch=>ch.charCodeAt(0));const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(0,12)},key,raw.slice(12));const pl=JSON.parse(new TextDecoder().decode(pt)),w=pl.who||{};BC.dev[d.id]=lc(w.email);(BC.devOn=BC.devOn||{})[d.id]={em:lc(w.email),on:pl.on!==false&&!!pl.sub,rem:!!(pl.items||[]).length,news:pl.news||{},at:+d.data().at||0}}catch(_){}}}catch(err){console.warn("bc dev",err&&err.code||err)}render()}
function bcPerson(em){if(!em)return "";for(const g of (S.crew||[]))for(const p of (g.people||[]))if(p.name&&lc(p.email)===em)return p.name;
  const m=(typeof ADM!=="undefined"&&ADM.mem||[]).find(x=>lc(x.email)===em);const n=m&&([m.firstName,m.lastName].filter(Boolean).join(" ")||m.name);return n||em}

function bcDevHTML(){if(!isAdmin())return "";if(!BC.dev){bcLoadDev();return ""}

document.addEventListener("click",async e=>{const bt=e.target.closest("[data-bcre]");if(!bt||!can("push.send")||BC.busy)return;const b=(BC.hist||[]).find(x=>x.id===bt.dataset.bcre);if(!b)return;

    const key=await getDataKey(),iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(pl))));

   the message links to it (./#bc=id&t=…&b=…), tapping the notification shows text and picture in the app ---------- */
function bcShrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);
  let W=im.naturalWidth,H=im.naturalHeight,max=1280;const out=q=>{const s=Math.min(1,max/Math.max(W,H)),w=Math.round(W*s),h=Math.round(H*s);const c=document.createElement("canvas");c.width=w;c.height=h;
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);return {url:c.toDataURL("image/jpeg",q),w,h}};
  let q=.78,r=out(q);while(r.url.length>420000&&(q>.45||max>640)){if(q>.45)q-=.1;else max=Math.round(max*.8);r=out(q)}
  r.kb=r.url.length*.75/1024;res(r)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("kein Bild"))};im.src=u})}
async function bcImgSave(dataUrl){const {F,db}=await fb();const key=await getDataKey(),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(dataUrl)));const all=new Uint8Array(12+ct.length);all.set(iv);all.set(ct,12);
  let bin="";for(let i=0;i<all.length;i+=8192)bin+=String.fromCharCode.apply(null,all.subarray(i,i+8192));
  const ref=await F.addDoc(F.collection(db,"bcimg"),{c:btoa(bin),at:F.serverTimestamp(),by:ME.uid});return ref.id}

async function bcImgLoad(id){if(BCIMG[id])return BCIMG[id];const {F,db}=await fb();const d=await F.getDoc(F.doc(db,"bcimg",id));if(!d.exists())throw new Error("weg");
  const raw=Uint8Array.from(atob(d.data().c),ch=>ch.charCodeAt(0)),key=await getDataKey();
  BCIMG[id]=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(0,12)},key,raw.slice(12)));return BCIMG[id]}

 hi:{"t": "TSCHUGGER ऐप में आपका स्वागत है!", "p": ["आपके साथ होने की खुशी है। यहाँ TSCHUGGER Tigerblood का शेड्यूल, Callsheets, Crew सूची, लोकेशन और स्क्रिप्ट एक ही जगह मिलेंगे।", "कृपया ध्यान दें: यह ऐप BETA परीक्षण संस्करण है। दिखाया गया सारा डेटा बिना गारंटी के है। प्रोडक्शन और डेवलपर्स डेटा के सही, पूर्ण या अद्यतन होने की कोई गारंटी नहीं देते। प्रोडक्शन के आधिकारिक दस्तावेज़ (शेड्यूल, Callsheet, Dispo) ही मान्य हैं।", "सारी सामग्री गोपनीय है और केवल Crew के लिए है – कृपया आगे न भेजें।", "कोई गलती मिली या कोई सुझाव है? Stefan Künzler से संपर्क करें।"], "c": "मैंने ये निर्देश पढ़ और समझ लिए हैं।", "b": "पुष्टि करें"},
 en:{t:"Welcome to the TSCHUGGER app!",p:["Great to have you on board. Here you'll find the shooting schedule, call sheets, crew list, locations and script of TSCHUGGER Tigerblood in one place.","Please note: the app is a BETA test version. All data shown is without guarantee. The production and the developers accept NO liability for the data being correct, complete or up to date. The official production documents (schedule, call sheet, dispo) are always binding.","All content is confidential and for the crew only – please do not share it.","Found a mistake or have a wish? Get in touch with Stefan Künzler."],c:"I have read and understood these notes.",b:"Confirm"}};
let WELCOME_OPEN=false;
async function welcomeDone(){
  if(MEMBER&&MEMBER.welcomeAck&&MEMBER.welcomeVer===WELCOME_VER)return true;
  let loc="";try{loc=localStorage.getItem("welcomeAck")||""}catch(_){}
  if(loc&&loc.split("|")[1]===WELCOME_VER)return true;
  try{const {F,db}=await fb();const d=await withTimeout(F.getDoc(F.doc(db,"prefs",ME.uid)),8000,"prefs");const w=d.exists()&&d.data().welcomeAck;if(w&&String(w).split("|")[1]===WELCOME_VER){try{localStorage.setItem("welcomeAck",w)}catch(_){}return true}}catch(_){}
  return false;
}
async function maybeWelcome(){
  if(!ME||WELCOME_OPEN||ONBOARD)return;
  if(await welcomeDone()){maybeTour();return}
  WELCOME_OPEN=true;let T=WTXT[LANG]||(LANG==="hi"?WTXT.en:WTXT.de);
  if(LANG==="de"||docRaw("welcome").custom||docRaw("disclaimer").custom){const w=docGet("welcome",{});const dis=docRaw("disclaimer").body.trim();
    T=Object.assign({},WTXT[LANG]||(LANG==="hi"?WTXT.en:WTXT.de),{t:w.subject,p:w.body.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean)});T.warnIdx=T.p.findIndex(x=>x===dis)}
  const d=document.createElement("div");d.id="welcome";d.className="a2hs";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");
  d.innerHTML='<div class="a2box wlbox"><span class="wlbeta">BETA</span><h3>'+esc(T.t)+'</h3>'+T.p.map((x,i)=>'<p'+(i===(T.warnIdx!==undefined?T.warnIdx:1)?' class="wlwarn"':'')+'>'+esc(x)+'</p>').join("")+
    '<label class="wlchk"><input type="checkbox" data-wlok> '+esc(T.c)+'</label><div class="a2b"><button type="button" class="pri" data-wlgo disabled>'+esc(T.b)+'</button></div><p class="amsg" role="alert"></p></div>';
  d.addEventListener("change",e=>{if(e.target.matches("[data-wlok]"))d.querySelector("[data-wlgo]").disabled=!e.target.checked});
  d.addEventListener("click",async e=>{const b=e.target.closest("[data-wlgo]");if(!b||b.disabled)return;b.disabled=true;
    const at=new Date().toISOString();store("welcomeAck",at+"|"+WELCOME_VER);savePrefs();
    try{if(MEMBER){const {F,db}=await fb();await F.updateDoc(F.doc(db,"members",ME.uid),{welcomeAck:at,welcomeVer:WELCOME_VER});MEMBER.welcomeAck=at;MEMBER.welcomeVer=WELCOME_VER}}catch(err){console.warn("welcome",err&&err.code||err)}
    d.remove();WELCOME_OPEN=false;maybeTour()});
  document.body.appendChild(d);
}
/* ---- presence: signed-in members leave a «last seen» mark every 2 minutes while the app is open (shown to admins) ---- */
let SEENT=null,SEENAT=0;
async function markSeen(){
  if(!ME||!MEMBER||document.visibilityState!=="visible"||Date.now()-SEENAT<100e3)return;SEENAT=Date.now();
  try{const {F,db}=await fb();await F.updateDoc(F.doc(db,"members",ME.uid),{lastSeen:F.serverTimestamp()})}catch(err){console.warn("seen",err&&err.code||err)}
}
setInterval(()=>{if(S.tab==="admin"&&ADM.sub==="users"&&document.visibilityState==="visible"&&ADM.loaded&&!ADM.loading){ADM.loading=true;admLoad().catch(()=>{}).finally(()=>{ADM.loading=false})}},60e3);
function startSeen(){clearInterval(SEENT);SEENAT=0;markSeen();SEENT=setInterval(markSeen,120e3)}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")markSeen()});
const seenMs=m=>{const j=m&&m.lastSeen;return j?(j.seconds?j.seconds*1000:(j.toMillis?j.toMillis():Date.parse(j)||0)):0};
const isOnline=m=>Date.now()-seenMs(m)<4*60e3;
function seenText(m){const t=seenMs(m);if(!t)return m&&m.active===true?L("noch nie online"):"";const d=Date.now()-t;if(d<4*60e3)return L("gerade aktiv");
  const mi=Math.round(d/60e3);if(mi<60)return L("zuletzt online")+" "+L("vor {n} Min.").replace("{n}",mi);
  const dt=new Date(t),hm=dt.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"}),day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime(),dd=Math.round((day(new Date())-day(dt))/864e5);
  return L("zuletzt online")+" "+(dd===0?L("heute")+" "+hm:dd===1?L("gestern")+" "+hm:dt.toLocaleDateString("de-CH")+" "+hm)}
let START=null;
async function afterSignIn(u){
  ME=u;
  /* account created by the owner with a start password: counts as confirmed, but a new password must be set first */
  START=null;if(!u.emailVerified||window.__checkStart){try{const {F,db}=await fb();const d=await withTimeout(F.getDoc(F.doc(db,"starts",lc(u.email))),10000,"start");if(d.exists())START=d.data()}catch(_){}}
  if(START&&START.mustChange){showGate("newpw");return}
  if(!u.emailVerified&&!START){showGate("verify");autoVerify(u);return}
  let st;try{st=await checkMember()}catch(err){console.error(err);
    if(isOffline(err)&&S.days.length){hideGate();acctButton(true);render();showMsg(L("Offline – du siehst den zuletzt geladenen Stand."),6000);return}
    showGate("login",L("Anmeldung nicht erreichbar. Bitte Internetverbindung prüfen."),true);return}
  if(st!=="ok"){clearLocal();render();showGate(st==="blocked"?"blocked":"denied");return}
  hideGate();acctButton(true);PUBB.loaded=false;PUBB.list=[];loadPrefs();startSeen();pushSyncSoon();menusLoad(true);
  const prof=MEMBER||{};
  let hasLocal=false;try{hasLocal=!!localStorage.getItem("lang")}catch(_){}
  if(prof.lang&&prof.lang!==LANG&&(window.__justSignedIn||!hasLocal)&&WDS[prof.lang]){LANG=prof.lang;store("lang",LANG);applyStatic();if(FB)FB.auth.languageCode=LANG;render()}
  try{await load(true)}catch(err){console.error(err);showMsg(isOffline(err)&&S.days.length?L("Offline – du siehst den zuletzt geladenen Stand."):loadErr(err),isOffline(err)?6000:15000)}
  await fillNamesFromCrew();
  /* first start, and whenever gender, phone or e-mail is missing: the profile form must be filled in */
  let partialAt=0;try{partialAt=+localStorage.getItem("profPartial:"+ME.uid)||0}catch(_){}
  const needExtra=(!MEMBER||!MEMBER.gender||!String(MEMBER.phone||"").trim()||!String(MEMBER.contactEmail||"").trim())&&Date.now()-partialAt>12*3600e3;
  if(MEMBER&&(!MEMBER.diet||needExtra))setTimeout(()=>showAcct(true),400);else setTimeout(maybeWelcome,600);
  if(window.__justSignedIn)window.__justSignedIn=false;
}
/* names come from the crew list (matched by e-mail) when the profile has none yet */
const crewNames=()=>{const p=ME&&crewPerson(ME.email);if(!p||!p.name)return null;const sp=splitName(p.name);return sp.firstName?{firstName:clean(sp.firstName),lastName:clean(sp.lastName||"")}:null};
async function fillNamesFromCrew(){
  if(!MEMBER||!ME)return;
  const cn=crewNames();if(!cn||(MEMBER.firstName===cn.firstName&&(MEMBER.lastName||"")===cn.lastName))return;
  const upd={firstName:cn.firstName,lastName:cn.lastName,name:[cn.firstName,cn.lastName].filter(Boolean).join(" ")};
  try{const {F,db}=await fb();await F.updateDoc(F.doc(db,"members",ME.uid),upd);Object.assign(MEMBER,upd)}catch(err){console.error(err)}
}

    const r=$("#refresh");r.parentNode.insertBefore(g,r);g.addEventListener("click",()=>{S.tab="admin";S.srcOpen=false;window.scrollTo(0,0);render()})}
  g.setAttribute("aria-label",L("App-Verwaltung"));g.title=L("App-Verwaltung");g.hidden=!(on&&canAdm());
  {const r=$("#refresh");if(r)r.classList.toggle("admhide",!!(on&&(isOwner()||can("settings"))))} /* admins find «Aktualisieren» in App-Verwaltung → Einstellungen */
  if(on&&can("users.requests"))checkRequests();
}

async function bkCollect(){
  const {F,db}=await fb();
  const col=async n=>{const q=await F.getDocs(F.collection(db,n));return q.docs.map(d=>({id:d.id,data:d.data()}))};
  const [members,invites,admins,bdays,cfg]=await Promise.all([col("members"),col("invites"),col("admins"),col("bdays").catch(()=>[]),F.getDoc(F.doc(db,"config","app"))]);
  const plain=v=>JSON.parse(JSON.stringify(v,(k,x)=>x&&typeof x==="object"&&typeof x.toDate==="function"?{__ts:x.toDate().toISOString()}:x));
  return plain({app:"tschugger-crew",version:1,createdAt:new Date().toISOString(),by:ME&&ME.email,config:cfg.exists()?cfg.data():null,members,invites,admins,bdays});
}
async function bkDownload(){
  const data=await bkCollect();const t=new Date();
  const name="tschugger-backup-"+t.getFullYear()+"-"+pad2(t.getMonth()+1)+"-"+pad2(t.getDate())+"-"+pad2(t.getHours())+pad2(t.getMinutes())+".json";
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}));
  const a=document.createElement("a");a.href=url;a.download=name;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  try{localStorage.setItem("bk:last",t.toISOString())}catch(_){}
  return L("Backup gespeichert")+": "+data.members.length+" "+L("Benutzer:innen")+", "+data.invites.length+" "+L("Einladungen")+".";
}
async function bkRestore(file){
  if(file.size>5e6)throw new Error(L("Datei ist zu gross."));
  let d;try{d=JSON.parse(await file.text())}catch(_){throw new Error(L("Datei ist kein gültiges Backup."))}
  if(!d||d.app!=="tschugger-crew"||!Array.isArray(d.members)||!Array.isArray(d.invites))throw new Error(L("Datei ist kein gültiges Backup."));
  if(!confirmSafe(L("Backup vom {d} wiederherstellen? Vorhandene Einträge werden ergänzt oder überschrieben.").replace("{d}",fmtStamp(d.createdAt||""))))return "";
  const {F,db}=await fb();const back=v=>JSON.parse(JSON.stringify(v),(k,x)=>x&&typeof x==="object"&&typeof x.__ts==="string"?F.Timestamp&&F.Timestamp.fromDate?F.Timestamp.fromDate(new Date(x.__ts)):x.__ts:x);
  const own=lc(ME&&ME.email),ok=/^[^/]{1,200}$/;const ops=[];
  if(d.config&&typeof d.config==="object")ops.push(["config","app",d.config]);
  for(const [n,list] of [["admins",d.admins],["invites",d.invites],["members",d.members],["bdays",d.bdays]])
    for(const r of (Array.isArray(list)?list:[]))if(r&&ok.test(String(r.id))&&r.data&&typeof r.data==="object"&&!(n==="members"&&lc(r.data.email)===own))ops.push([n,String(r.id),r.data]);
  let done=0,fail=0;
  for(let i=0;i<ops.length;i+=300){const batch=F.writeBatch(db);ops.slice(i,i+300).forEach(([n,id,v])=>batch.set(F.doc(db,n,id),back(v),{merge:true}));
    try{await batch.commit();done+=Math.min(300,ops.length-i)}catch(err){console.error(err);fail+=Math.min(300,ops.length-i)}}
  ADM.loaded=false;
  return L("Wiederhergestellt")+": "+done+(fail?" · "+L("fehlgeschlagen")+": "+fail:"");
}

/* owner only: account with a one-time start password, created in a second Firebase instance so the owner stays signed in */
function genPw(){const c="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=new Uint32Array(12);crypto.getRandomValues(r);
  const x=[...r].map(v=>c[v%c.length]).join("");return x.slice(0,4)+"-"+x.slice(4,8)+"-"+x.slice(8)}
async function createStartAccount(em,nm){
  em=lc(em);const {AP,A,F,db}=await fb();const pw=genPw();
  await F.setDoc(F.doc(db,"starts",em),{mustChange:true,at:F.serverTimestamp()});
  if(!ADM.inv.some(i=>i.id===em))await F.setDoc(F.doc(db,"invites",em),{name:String(nm||"").slice(0,80),role:"",addedAt:F.serverTimestamp()});await assignCrew(em);
  const a2=AP.initializeApp(FB_CONFIG,"start"+Date.now());
  try{const au=typeof A.initializeAuth==="function"&&A.inMemoryPersistence?A.initializeAuth(a2,{persistence:A.inMemoryPersistence}):A.getAuth(a2);
    await A.createUserWithEmailAndPassword(au,em,pw);try{await A.signOut(au)}catch(_){}}
  catch(err){try{await F.deleteDoc(F.doc(db,"starts",em))}catch(_){}throw err}
  finally{try{AP.deleteApp&&await AP.deleteApp(a2)}catch(_){}}
  return pw;
}

/* new users get the role «Crew» automatically (an invitation creates userroles/{email} = crew) */
async function assignCrew(em){em=lc(em);if(!em||ADMINS.includes(em)||(ADM.adm||[]).includes(em)||(ADM.ur||{})[em])return;
  try{const {F,db}=await fb();await F.setDoc(F.doc(db,"userroles",em),{role:"crew",at:F.serverTimestamp()});ADM.ur=ADM.ur||{};ADM.ur[em]="crew"}catch(err){console.warn("crew role",err&&err.code||err)}}
/* once (owner): everyone already in the app without a role gets «Crew», so nobody loses access */
async function migrateCrew(){
  if(!isOwner())return;try{if(localStorage.getItem("crewMigrated")==="1")return}catch(_){}
  try{const {F,db}=await fb();const cfg=await F.getDoc(F.doc(db,"config","app"));if(cfg.exists()&&cfg.data().crewMigrated){try{localStorage.setItem("crewMigrated","1")}catch(_){}return}
    const [m,i,a,u]=await Promise.all([F.getDocs(F.collection(db,"members")),F.getDocs(F.collection(db,"invites")),F.getDocs(F.collection(db,"admins")),F.getDocs(F.collection(db,"userroles"))]);
    const has=new Set(u.docs.map(d=>d.id)),adm=new Set(a.docs.map(d=>d.id));
    const ems=[...new Set(m.docs.map(d=>lc(d.data().email||"")).concat(i.docs.map(d=>d.id)))].filter(e=>e&&!has.has(e)&&!adm.has(e)&&!ADMINS.includes(e));
    for(let k=0;k<ems.length;k+=400){const b=F.writeBatch(db);ems.slice(k,k+400).forEach(e=>b.set(F.doc(db,"userroles",e),{role:"crew",at:F.serverTimestamp()}));await b.commit()}
    await F.setDoc(F.doc(db,"config","app"),{crewMigrated:true},{merge:true});try{localStorage.setItem("crewMigrated","1")}catch(_){}
    if(ems.length)console.info("crew role assigned to",ems.length);ADM.loaded=false}
  catch(err){console.warn("crew migration",err&&err.code||err)}
}

const pad2x=n=>String(n).padStart(2,"0");

/* ---------- 2) changes since the last visit on this device ---------- */
/* a snapshot of the schedule (scenes with date, unit, time, place) and the callsheet times is kept on the device;
   when new data arrives, the differences are listed for 3 days and the scenes are marked in the schedule */
function chgSnap(){
  const t=todayISO(),sc={},dp={};
  for(const d of S.days||[]){if(!d.date||d.date<t)continue;
    for(const [u,its] of unitItems(d))its.forEach(it=>{if(!it.sc)return;let k=u+"|"+scKey(it.sc),n=2;while(sc[k])k=u+"|"+scKey(it.sc)+"#"+(n++);
      sc[k]={date:d.date,u,sc:String(it.sc),t:String(it.t||""),loc:String(it.loc||""),set:String(it.set||"")}})}
  for(const x of S.dispos||[]){if(!x||!x.date||x.date<t)continue;dp[x.date]={call:String(x.crewCall||x.generalCall||""),wrap:String(x.wrap||""),v:String(x.version||"")}}
  return {sc,dp,at:Date.now()};
}
function chgLoad(){try{return JSON.parse(localStorage.getItem("chg:v1")||"[]")||[]}catch(_){return []}}
function chgSave(l){try{localStorage.setItem("chg:v1",JSON.stringify(l.slice(0,120)))}catch(_){}}
function chgDetect(){
  if(!(S.days||[]).length)return;
  const now=chgSnap();let old=null;try{old=JSON.parse(localStorage.getItem("snap:v1")||"null")}catch(_){}
  try{localStorage.setItem("snap:v1",JSON.stringify(now))}catch(_){}
  if(!old||!old.sc)return;
  const t=todayISO(),out=[],at=Date.now();
  const add=(o)=>out.push(Object.assign({id:Math.random().toString(36).slice(2,9),at},o));
  for(const k in now.sc){const a=old.sc[k],b=now.sc[k];
    if(!a){add({date:b.date,u:b.u,sc:b.sc,kind:"new",txt:L("Neu im Drehplan")+(b.t?" · "+b.t:"")});continue}
    if(a.date!==b.date){add({date:b.date,u:b.u,sc:b.sc,kind:"move",txt:L("verschoben")+": "+dmy(a.date)+" → "+dmy(b.date)+(b.t?" · "+b.t:"")});continue}
    if(a.t!==b.t&&(a.t||b.t))add({date:b.date,u:b.u,sc:b.sc,kind:"time",txt:L("Zeit")+": "+(a.t||"–")+" → "+(b.t||"–")});
    if(a.loc!==b.loc)add({date:b.date,u:b.u,sc:b.sc,kind:"loc",txt:L("Ort")+": "+(b.loc||"–")});
  }
  for(const k in old.sc){const a=old.sc[k];if(!now.sc[k]&&a.date>=t&&!Object.values(now.sc).some(b=>b.u===a.u&&scKey(b.sc)===scKey(a.sc)))add({date:a.date,u:a.u,sc:a.sc,kind:"gone",txt:L("nicht mehr im Drehplan")})}
  for(const dte in now.dp){const a=(old.dp||{})[dte],b=now.dp[dte];
    if(!a){add({date:dte,kind:"cs",txt:L("Neues Callsheet")+(b.call?" · Crew Call "+b.call:"")});continue}
    if(a.call!==b.call&&(a.call||b.call))add({date:dte,kind:"cs",txt:"Crew Call: "+(a.call||"–")+" → "+(b.call||"–")});
    else if(a.v!==b.v&&b.v)add({date:dte,kind:"cs",txt:L("Callsheet aktualisiert")+" ("+b.v+")"});
  }
  if(!out.length)return;
  const keep=chgLoad().filter(c=>at-c.at<3*864e5&&c.date>=t);
  /* newest wins for the same scene and kind */
  const merged=out.concat(keep.filter(c=>!out.some(o=>o.kind===c.kind&&o.sc===c.sc&&o.u===c.u&&o.date===c.date)));
  chgSave(merged);
  try{if(document.visibilityState==="visible"&&vok("plan"))showMsg(L("Drehplan geändert")+": "+out.length+" "+L(out.length===1?"Änderung":"Änderungen")+" – "+L("siehe «Heute»"),6000)}catch(_){}
}

/* ---------- 11) Protokoll: who changed what in the administration (roles, users, menus, settings, messages) ---------- */
const AUDIT_COLS=["roles","userroles","admins","owners","invites","members","menus","config","broadcasts","starts","requests"];
function auditSum(col,data,op){
  if(op==="delete")return "";
  if(col==="broadcasts")return data&&data.c?L("Nachricht gesendet"):(data&&data.sent?L("versendet"):"");
  if(!data||typeof data!=="object")return "";
  const out=[];for(const [k,v] of Object.entries(data)){if(["at","by","addedAt","joinedAt","lastSeen","c"].includes(k))continue;if(v&&typeof v==="object"&&!Array.isArray(v)&&(v._methodName||v.constructor&&/FieldValue|Sentinel/.test(v.constructor.name)))continue;
    let s=Array.isArray(v)?v.join(", "):typeof v==="object"?JSON.stringify(v):String(v);if(s.length>60)s=s.slice(0,57)+"…";out.push(k+": "+s)}
  return out.join(" · ").slice(0,280);
}
function auditWrap(fs){
  const F=Object.assign({},fs);
  const log=(op,ref,data)=>{try{const path=String(ref&&ref.path||"");const [col,id]=path.split("/");if(!AUDIT_COLS.includes(col)||!ME||!ME.email)return;
    if(col==="members"&&id===ME.uid)return; /* own profile, last seen */
    if(col==="requests"&&id===lc(ME.email))return;
    fs.addDoc(fs.collection(FB.db,"audit"),{by:lc(ME.email),at:fs.serverTimestamp(),op,col,id:String(id||"").slice(0,120),sum:auditSum(col,data,op)}).catch(()=>{})}catch(_){}};
  F.setDoc=async(ref,data,o)=>{const r=await fs.setDoc(ref,data,o);log("set",ref,data);return r};
  F.updateDoc=async(ref,data)=>{const r=await fs.updateDoc(ref,data);log("update",ref,data);return r};
  F.deleteDoc=async(ref)=>{const r=await fs.deleteDoc(ref);log("delete",ref,null);return r};
  F.addDoc=async(col,data)=>{const r=await fs.addDoc(col,data);if(col&&col.path!=="audit")log("add",{path:col.path+"/"+(r&&r.id||"")},data);return r};
  return F;
}
const AUD={list:null,busy:false,q:"",at:0};
async function auditLoad(){AUD.busy=true;try{const {F,db}=await fb();let q;
    try{q=await F.getDocs(F.query(F.collection(db,"audit"),F.orderBy("at","desc"),F.limit(300)))}catch(_){q=await F.getDocs(F.collection(db,"audit"))}
    AUD.list=q.docs.map(d=>Object.assign({id_:d.id},d.data())).map(x=>Object.assign(x,{ms:x.at&&x.at.toMillis?x.at.toMillis():(x.at&&x.at.seconds?x.at.seconds*1000:Date.parse(x.at)||0)})).sort((a,b)=>b.ms-a.ms).slice(0,300);AUD.err=""}
  catch(err){AUD.list=[];AUD.err=(err&&err.code)||String(err)}AUD.busy=false;AUD.at=Date.now();render()}
const AUDLBL={roles:"Rolle",userroles:"Rolle zugewiesen",admins:"Admin",owners:"Owner",invites:"Einladung",members:"Profil",menus:"Menü",config:"Einstellungen",broadcasts:"Push-Nachricht",starts:"Startpasswort",requests:"Zugangsanfrage"};
const AUDOP={set:"gespeichert",update:"geändert",delete:"gelöscht",add:"erstellt"};
function auditSecInner(){
  if(!AUD.list&&!AUD.busy)auditLoad();
  if(!AUD.list)return '<div class="empty">'+L("Lade Protokoll …")+'</div>';
  const nameOf=e=>{const cp=typeof crewPerson==="function"?crewPerson(e):null;const m=(ADM.mem||[]).find(x=>x.email===e);return (cp&&cp.name)||(m&&[m.firstName,m.lastName].filter(Boolean).join(" "))||e};
  const memName=uid=>{const m=(ADM.mem||[]).find(x=>x.uid===uid);return m?nameOf(m.email):uid};
  const q=fold(AUD.q);
  const rows=AUD.list.map(x=>{const tgt=x.col==="members"?memName(x.id):x.col==="roles"?(((ADM.roles||[]).find(r=>r.id===x.id)||{}).name||x.id):x.col==="menus"?dmy(x.id):x.col==="config"?"":x.col==="broadcasts"?"":/@/.test(x.id)?nameOf(x.id):x.id;
    return Object.assign({},x,{who:nameOf(x.by),tgt,what:L(AUDLBL[x.col]||x.col)+" "+L(AUDOP[x.op]||x.op)})}).filter(x=>!q||fold([x.who,x.tgt,x.what,x.sum].join(" ")).includes(q));
  return '<div class="admins audit"><h3>'+L("Log")+' <small>'+AUD.list.length+'</small></h3><p class="ahint">'+L("Wer hat wann Rollen, Benutzende, Menüs, Einstellungen oder Push-Nachrichten geändert – die letzten 300 Einträge.")+'</p>'+
    (AUD.err?'<p class="amsg">'+esc(L("Protokoll nicht lesbar – bitte die neuen Firestore-Regeln veröffentlichen."))+' ('+esc(AUD.err)+')</p>':'')+
    '<div class="audbar"><input type="search" data-audq placeholder="'+esc(L("Suchen: Person, Rolle, Menü …"))+'" value="'+esc(AUD.q)+'"><button type="button" class="cico" data-audre aria-label="'+esc(L("Neu laden"))+'" title="'+esc(L("Neu laden"))+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button></div>'+
    (rows.length?audDays(rows,x=>'<li><div class="audh"><b>'+esc(x.what)+'</b>'+(x.tgt?' <span class="audt">'+esc(x.tgt)+'</span>':'')+'<span class="audw">'+esc(x.ms?new Date(x.ms).toLocaleString("de-CH",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"")+'</span></div><div class="audb">'+esc(x.who)+(x.sum?' · <span class="ghint">'+esc(x.sum)+'</span>':'')+'</div></li>')):'<p class="ghint">'+L("Noch keine Einträge.")+'</p>')+'</div>';
}

const TST={d:null,busy:false,run:false,msg:"",open:false,closed:false,su:{}}; /* parts stay closed until opened (only for this visit) */
const TST_RUN='<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px"><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10"/><path d="M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/></svg>';

async function testsLoad(){if(TST.busy)return;TST.busy=true;try{const r=await fetch("./tests.json?t="+Date.now(),{cache:"no-store"});TST.d=r.ok?await r.json():{none:true}}catch(_){TST.d={none:true}}TST.busy=false;render()}
/* open/close button at the right end of every box in Log/Tests */
function tstAllBtn(){return '<button type="button" class="tstall" data-tstall aria-label="'+esc(L("Alles auf- oder zuklappen"))+'" title="'+esc(L("Alles auf- oder zuklappen"))+'">'+TST_ALL+'</button>'}
function testsSec(){
  if(!TST.d){testsLoad();return '<details class="tstsec"><summary><b>'+esc(L("Automatische Tests"))+'</b> · '+esc(L("Lade …"))+'</summary></details>'}
  const d=TST.d;if(d.none)return '<details class="tstsec"><summary>'+esc(L("Automatische Tests"))+' · '+esc(L("noch keine Resultate"))+'</summary></details>';
  const dt=new Date(d.at||0),when=dt.toLocaleDateString(LOC[LANG]||"de-CH",{day:"2-digit",month:"2-digit"})+" "+dt.toLocaleTimeString(LOC[LANG]||"de-CH",{hour:"2-digit",minute:"2-digit"});
  const suites=Array.isArray(d.suites)&&d.suites.length?d.suites:[{name:"",ok:d.ok,n:d.n,fail:d.fail,checks:d.checks||[]}];
  const head=d.crash?'✗ '+L("Tests abgebrochen"):d.ok?'✓ '+L("{n} von {n} bestanden").split("{n}").join(d.n):'✗ '+L("{f} von {n} fehlgeschlagen").replace("{f}",d.fail).replace("{n}",d.n);
  return '<details class="tstsec'+(d.ok?'':' bad')+'"'+(TST.open?' open':'')+' data-lsec="tst"><summary><b>'+esc(L("Automatische Tests"))+'</b>'+' · <span class="tsth">'+esc(head)+'</span> · '+esc(when)+(d.sha?' · <a href="https://github.com/furtschellas/Tschugger/commit/'+esc(d.sha)+'" target="_blank" rel="noopener noreferrer">'+esc(d.sha)+'</a>':'')+tstAllBtn()+'</summary>'+
    '<p class="ghint">'+esc(L("Vor jeder Veröffentlichung von neuem Code prüft GitHub die Hintergrund-Abläufe, die App mit sechs Rollen auf Handy und Desktop, die Funktionen und die Firestore-Regeln. Schlägt ein Test fehl, wird nicht veröffentlicht."))+'</p>'+
    suites.map(su=>{const cs=(su.checks||[]).slice().sort((a,b)=>a.ok-b.ok);
      return (su.name?'<details class="tstsu'+(su.ok?'':' bad')+'" data-su="'+esc(su.name)+'"'+(TST.su[su.name]?' open':'')+'><summary>'+(su.ok?'✓ ':'✗ ')+esc(L(su.name))+' · '+(su.crash?esc(L("abgebrochen")):su.ok?su.n:(su.n-su.fail)+'/'+su.n)+'</summary>':'')+
        '<ul class="tstl">'+cs.map(c=>'<li class="'+(c.ok?'ok':'no')+'">'+(c.ok?'✓':'✗')+' '+esc(c.n)+(c.e?'<br><small>'+esc(c.e)+'</small>':'')+'</li>').join("")+'</ul>'+(su.name?'</details>':'')}).join("")+
    '<div class="arb tstbtns">'+(window.CHATURL&&isAdmin()?'<button type="button" class="pillbtn" data-tstrun'+(TST.run?' disabled':'')+'>'+TST_RUN+esc(L(TST.run?"Tests laufen …":"Tests jetzt starten"))+'</button>':'')+'<button type="button" class="pillbtn" data-tstre>↻ '+esc(L("Neu laden"))+'</button></div>'+(TST.msg?'<p class="ghint">'+esc(TST.msg)+'</p>':'')+'</details>';
}

    if(r.ok){const t0=Date.now(),before=TST.d&&TST.d.at;const poll=async()=>{if(Date.now()-t0>25*60e3){TST.run=false;render();return}TST.d=null;await testsLoad();if(TST.d&&TST.d.at&&TST.d.at!==before){TST.run=false;TST.msg="";render();return}setTimeout(poll,60e3)};setTimeout(poll,90e3)}else TST.run=false}
  catch(err){TST.run=false;TST.msg=L("Fehler:")+" "+(err.message||err)}render()});

const OWN={list:null,busy:false,at:0,roles:null};

async function ownDec(key,c){const raw=Uint8Array.from(atob(c),ch=>ch.charCodeAt(0));return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(0,12)},key,raw.slice(12))))}
async function ownEnc(o){const key=await getDataKey(),iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(o))));
  const all=new Uint8Array(12+ct.length);all.set(iv);all.set(ct,12);let bin="";for(let i=0;i<all.length;i+=8192)bin+=String.fromCharCode.apply(null,all.subarray(i,i+8192));return btoa(bin)}
async function ownLoad(force){

function dckSplit(t){const act=[],dlg=[];let inD=false;for(const raw of String(t||"").split("\n")){const l=raw.trim();
    if(!l){inD=false;continue}
    if(/^[A-ZÄÖÜ][A-ZÄÖÜ'\-]+(?: [A-ZÄÖÜ][A-ZÄÖÜ'\-]+)?\s*(\([^)]*\))?\s*$/.test(l)){act.push(l);inD=true;continue}
    if(/^\(.*\)$/.test(l)&&inD)continue;(inD?dlg:act).push(l)}
  return {a:fold(act.join(" ")),d:fold(dlg.join(" "))}}

    '<p class="ghint">'+esc(L("Zeigt die App einen Moment mit den Rechten jeder Rolle: welche Bereiche sie sieht, welche Zusatzrechte sie hat, ob alle Seiten ohne Fehler erscheinen und ob Telefon, E-Mail und Kopf-Symbole nur mit Recht sichtbar sind. Es wird nichts geändert."))+'</p>'+
    r.slice().sort((a,b)=>b.issues.length-a.issues.length).map(x=>'<details class="tstsu'+(x.issues.length?' bad':'')+'" data-su="rt:'+esc(x.name)+'"'+logSu("rt:"+x.name)+'><summary>'+(x.issues.length?'⚠ ':'✓ ')+esc(x.name)+' · '+(x.issues.length?x.issues.length+' '+esc(L(x.issues.length===1?"Problem":"Probleme")):esc(L("in Ordnung")))+'</summary>'+
      '<ul class="tstl"><li class="ok">'+esc(L("Sieht"))+': '+esc(x.tabs.join(", ")||"–")+'</li>'+(x.extra.length?'<li class="ok">'+esc(L("Darf"))+': '+esc(x.extra.join(", "))+'</li>':'')+x.issues.map(t=>'<li class="no">✗ '+esc(t)+'</li>').join("")+'</ul></details>').join("")+
    '<div class="arb tstbtns"><button type="button" class="pillbtn" data-rtrun'+(RTS.busy?' disabled':'')+'>'+TST_RUN+esc(L(RTS.busy?"Prüfe …":"Jetzt prüfen"))+'</button></div></details>'};

/* =====================================================================
   NEUE DREHBUCH-VERSION: einmalige Nachricht (nur mit «Drehbuch sehen»), mit Szenen und dem ganzen Changelog zum Aufklappen
   ===================================================================== */
const scrNewsKey=sx=>(sx.v||"")+"|"+(sx.at||"");
function scrNewsDue(){const sx=S.meta&&S.meta.scriptChange;if(!ME||!sx||!sx.at||!vok("script"))return null;
  const at=Date.parse(sx.at);if(!at||Date.now()-at>14*864e5)return null;   /* older than two weeks: no longer news */
  let seen="";try{seen=localStorage.getItem("scrv")||""}catch(_){}return seen===scrNewsKey(sx)?null:sx}
function scrNewsBusy(){return (typeof ONBOARD!=="undefined"&&ONBOARD)||(typeof WELCOME_OPEN!=="undefined"&&WELCOME_OPEN)||(typeof TOUR!=="undefined"&&TOUR.el)||
  ["news","rolechg","pushhint","scrnews","welcome","gate"].some(id=>{const e=document.getElementById(id);return e&&!e.hidden&&e.offsetParent!==null})}
function showScriptNews(sx){
  store("scrv",scrNewsKey(sx));if(typeof savePrefsSoon==="function")savePrefsSoon();
  const sc=arr(sx.scenes),dt=new Date(Date.parse(sx.at));
  const d=document.createElement("div");d.id="scrnews";d.className="a2hs";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");
  d.innerHTML='<div class="a2box wlbox scrbox"><span class="wlbeta">'+esc(L("Neu"))+'</span><h3>'+esc(L("Neue Drehbuch-Version"))+' '+esc(sx.v||"")+'</h3>'+
    '<p>'+esc(L("Seit {d} ist das Drehbuch {v} in der App.").replace("{d}",dmy(dt.toISOString().slice(0,10))).replace("{v}",sx.v||""))+(sx.prev&&sx.prev!==sx.v?' '+esc(L("Vorher")+": "+sx.prev+"."):'')+'</p>'+
    (sc.length?'<p class="scrsc"><b>'+esc(L(sc.length===1?"Geänderte Szene":"Geänderte Szenen"))+':</b> '+sc.map(x=>'<button type="button" class="lnk" data-scene="'+esc(x)+'">'+esc(x)+'</button>').join(", ")+'</p>':'')+
    (sx.log?'<details class="scrlog"><summary>'+esc(L("Ganzes Changelog"))+'</summary>'+clogHTML(sx.log)+'</details>':'')+
    '<div class="a2b"><button type="button" data-scrn="open">'+esc(L("Drehbuch öffnen"))+'</button><button type="button" class="pri" data-scrn="ok">'+esc(L("OK"))+'</button></div></div>';
  d.addEventListener("click",e=>{const b=e.target.closest("[data-scrn]");if(e.target.closest("[data-scene]")){d.remove();return}if(!b)return;d.remove();
    if(b.dataset.scrn==="open"){S.tab="script";try{store("tab","script")}catch(_){}window.scrollTo(0,0);render()}});
  document.body.appendChild(d)}
window.maybeScriptNews=function(){if(window.__scrNewsOff)return;const sx=scrNewsDue();if(sx&&!scrNewsBusy())showScriptNews(sx)};
setInterval(()=>{try{window.maybeScriptNews()}catch(_){}},4000);
