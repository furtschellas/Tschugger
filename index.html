<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#110d1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tschugger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Tschugger Tigerblood Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" rel="stylesheet" media="print" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Permanent+Marker&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>(function(){var l=document.getElementById("gf");function on(){l.media="all"}if(l.sheet)on();else{l.addEventListener("load",on);setTimeout(on,3000)}})();</script>
<style>
/* Layout: phone-first call sheet — sticky header, day strip, timeline; tab bar pinned to the bottom */
/* Look: "Tschugger" night poster — dusk sky over the Valais, cream stencil type, neon pink spray, gold chains */
:root{
  --paper:#110d1c; --sheet:#1b1529; --ink:#f4ead6; --muted:#a79cbb; --rule:#2f2644;
  --accent:#ff2e8a; --accent-ink:#1a0712; --accent-soft:rgba(255,46,138,.16);
  --gold:#f2b33d;
  --day:#f2c94c; --eve:#f08a3c; --night:#8b7cff; --morn:#ff79b8;
  --off:#161124; --warn:#ff8f4a;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-marker:"Permanent Marker","Barlow Condensed",cursive;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{padding-block:14px 10px;border-bottom:1px solid var(--rule);position:relative}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--accent),transparent 70%)}
.eyebrow span{white-space:nowrap}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.eyebrow{flex:1;min-width:0;line-height:1.35;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{white-space:nowrap;font-family:var(--f-display);font-weight:800;font-size:clamp(23px,7.8vw,30px);line-height:.95;margin:4px 0 0;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.35)}
h1 span{display:inline-block;font-family:var(--f-marker);font-weight:400;text-transform:none;font-size:.87em;color:var(--accent);transform:rotate(-4deg) translateY(-1px);margin-left:4px;text-shadow:0 0 18px rgba(255,46,138,.45)}
.stand{font-size:11px;color:var(--muted);margin-top:4px}
.standrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.refresh{flex:0 0 auto;display:grid;place-items:center;width:28px;height:28px;padding:0;border:0;color:var(--muted);background:transparent;border-radius:50%;font-size:17px;line-height:1;cursor:pointer;position:relative}
.refresh::after{content:"";position:absolute;inset:-8px}
.refresh.spin{animation:rot 1s linear infinite;color:var(--accent)}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.refresh.spin{animation:none}}
.refresh:disabled{opacity:.55;cursor:default}
.refmsg{font-size:12px;color:var(--muted);margin-top:4px}
.stand b{font-weight:500;color:var(--ink)}

/* day strip */
.strip{display:flex;gap:3px;overflow-x:auto;padding-block:6px;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--paper);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--rule);scroll-padding-inline:16px}
.strip::-webkit-scrollbar{display:none}
.stripwrap{display:flex;align-items:stretch;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--paper);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:6px 0 6px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--rule)}
.strip.in{position:static;flex:1;min-width:0;margin:0;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 0;border:0;background:transparent;scroll-padding-inline:8px}
.pub{display:flex;gap:3px;flex:none;padding-right:6px;border-right:1px solid var(--rule)}
.pub button{font:inherit;font-size:13px;font-weight:600;width:40px;padding:0;border:1px solid var(--rule);border-radius:99px;background:var(--sheet);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pub button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1a1206}
.pub button.u2[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pub button.none{opacity:.45}
@media (max-width:600px){.pub{gap:2px;padding-right:4px}.pub button{width:30px;font-size:12px;letter-spacing:-.02em}}
.chip{flex:0 0 auto;min-width:0;border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:3px 5px;line-height:1.15;text-align:center;cursor:pointer}
.chip .cw{font-family:var(--f-mono);font-size:9px;font-weight:400;text-transform:uppercase;color:var(--muted);margin-right:3px}
.chip .dd{white-space:nowrap;font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.05}
.chip .lb{font-family:var(--f-mono);font-size:10.5px;letter-spacing:-.02em;white-space:nowrap;text-transform:uppercase;color:var(--muted)}
.chip.off{background:var(--off)}
.chip.off .dd{color:var(--muted)}
.chip.free{background:rgba(64,132,255,.18);border-color:#4f8cff}
.chip.free .dd,.chip.free .lb,.chip.free .cw{color:#a9c8ff}
.chip[disabled]{cursor:default;color:inherit;opacity:1}
.chip.today{border-color:var(--accent)}
.chip[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-selected="true"] .cw,.chip[aria-selected="true"] .lb,.chip[aria-selected="true"] .dd{color:var(--accent-ink)}

/* day header */
.dayhead{margin-top:12px;display:grid;gap:8px}
.dayhead h2{font-family:var(--f-display);font-size:28px;font-weight:700;margin:0;line-height:1}
.dayhead .date{font-size:14px;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:4px 8px;display:flex;align-items:baseline;gap:6px}
.fact .k{font-family:var(--f-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fact .v{font-family:var(--f-mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.notes{display:grid;gap:6px}
.note{font-size:13px;padding:8px 10px;border-radius:6px;background:var(--accent-soft)}
.note.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}

.units{display:flex;gap:0;border:1px solid var(--rule);border-radius:8px;overflow:hidden;width:max-content;margin-top:16px}
.units button{border:0;background:var(--sheet);padding:7px 14px;cursor:pointer;font-size:13px;font-weight:500}
.units button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.units button.none{opacity:.45}
.uh{font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin:18px 0 0;padding-top:12px;border-top:1px solid var(--rule)}
.uh{color:var(--gold)}
.uh.u2{color:var(--accent)}
.unitfacts{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:8px}

/* timeline */
ol.tl{list-style:none;margin:12px 0 0;padding:0;display:grid}
.row{display:grid;grid-template-columns:52px 1fr;gap:10px;padding-block:6px}
.row .t{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);padding-top:3px}
.row.ev .what{font-size:13px;color:var(--muted);border-left:2px solid var(--rule);padding-left:10px}
.row.ev .what b{color:var(--ink);font-weight:500}
.sc{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;min-width:0;display:grid;gap:6px}
.sc .l1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.scn{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1}
.ie{font-family:var(--f-mono);font-size:11px;font-weight:500;padding:2px 6px;border-radius:4px;color:#16202a;background:var(--day)}
.ie.ev{background:var(--eve)} .ie.n{background:var(--night);color:#120d1c} .ie.mo{background:var(--morn)}
.set{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.02em;text-transform:uppercase;min-width:0}
.desc{font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.meta .m{font-family:var(--f-mono)}
.loc{font-size:13px}
.cast{display:flex;flex-wrap:wrap;gap:4px}
.cast span{font-size:12px;border:1px solid var(--rule);border-radius:99px;padding:1px 8px;background:var(--paper)}
.cast span i{font-style:normal;font-family:var(--f-mono);color:var(--muted);margin-right:4px}
.offday{margin-top:18px;padding:22px;border:1px dashed var(--rule);border-radius:8px;text-align:center;color:var(--muted)}
.offday b{display:block;font-family:var(--f-display);font-size:26px;color:var(--ink)}

/* lists */
.search{width:100%;margin-top:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:4;box-shadow:0 0 0 8px var(--paper);padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);font:inherit}
section.dept{margin-top:20px}
h3.dh{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px;color:var(--accent)}
.people{background:var(--sheet);border:1px solid var(--rule);border-radius:8px}
.p{padding:8px 12px;display:grid;gap:1px;border-top:1px solid var(--rule)}
.p:first-child{border-top:0}
.p .role{font-size:12px;color:var(--muted)}
.p .nm{font-weight:600}
.p .ct{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;align-items:center;margin-top:2px}
.p .hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px}
.p .ct .em{font-family:var(--f-body);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.p .ct span{font-family:var(--f-mono);font-size:14px;user-select:all}
.p .ct a{padding-block:4px}
.copy{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer}

.lc{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px;display:grid;gap:8px;margin-top:16px}
.lc h4{margin:0;font-family:var(--f-display);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.lc .addr{font-size:14px;white-space:pre-line}
.lc .scs{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lc .days{display:flex;flex-wrap:wrap;gap:4px}
.lc .days button{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:99px;padding:1px 9px;font-size:12px;cursor:pointer}


.scbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.scbar>*{justify-content:center;min-height:42px;font-size:13px!important;padding:4px 6px!important;white-space:nowrap;min-width:0;border-radius:10px!important}
.scbar .scall{gap:5px}
.mapbtn{display:flex;align-items:center;gap:5px;border-radius:99px;background:var(--sheet);color:var(--accent);border:1px solid var(--accent);text-decoration:none;font-weight:600;padding:6px 14px}
.scall{border:1px solid var(--accent);color:var(--accent);background:var(--sheet);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;min-height:36px}
.scall{display:inline-flex;align-items:center;gap:8px}
.scall::before{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.scall.on::before{transform:rotate(45deg)}
.scall.on{background:var(--accent);color:var(--accent-ink)}
.lch{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;width:100%;padding:0;border:0;background:transparent;text-align:left;cursor:pointer;font:inherit;color:inherit}
.lch h4{grid-column:1}
.lch .lcm{grid-column:1;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.lch::after{content:"";grid-column:2;grid-row:1/span 2;width:9px;height:9px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg);transition:transform .15s;margin-right:4px}
.lc.open .lch::after{transform:rotate(-135deg)}
.ubs{display:inline-flex;gap:4px;margin-left:8px;vertical-align:3px}
.ub{font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:0;text-transform:none;padding:1px 6px;border-radius:4px;background:var(--gold);color:#1a1206;white-space:nowrap}
.ub.u2{background:var(--accent-soft);color:var(--accent)}

.uf{min-height:42px;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.uf[aria-pressed="true"]{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.uf.u2[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lang{flex:none;display:flex;gap:0;background:var(--sheet);border:1px solid var(--rule);border-radius:99px;padding:2px;z-index:2}
.lang button{border:0;background:transparent;color:var(--muted);font-family:var(--f-mono);font-size:11px;font-weight:500;padding:3px 4px;border-radius:99px;cursor:pointer;min-height:26px;min-width:25px;letter-spacing:-.02em}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hbtns{display:flex;gap:2px;align-items:center}
.gsearch{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gsearch[hidden]{display:none!important}
.sh{display:flex;gap:8px;align-items:center;padding-block:12px;border-bottom:1px solid var(--rule);max-width:760px;width:100%;margin:0 auto}
.sh input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--accent);border-radius:99px;background:var(--sheet);color:var(--ink);font:inherit;font-size:16px}
.sclose{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;padding:8px 4px}
.sres{flex:1;overflow-y:auto;max-width:760px;width:100%;margin:0 auto;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.sres h3{margin:18px 0 6px}
.sr{display:grid;gap:2px;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:9px 12px;margin-top:6px;cursor:pointer;font:inherit;color:var(--ink)}
.sr .t1{font-weight:600;font-size:14px}
.sr .t2{font-size:12px;color:var(--muted)}
.sr mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 1px}
.shint{color:var(--muted);font-size:14px;margin-top:20px}
.sc.hit{outline:2px solid var(--accent);outline-offset:2px;transition:outline-color 1s}
.adl{display:grid;gap:2px;font-size:13px}
.adl a{font-size:12px;margin-left:4px}
.scb .mot{margin-top:0}
.lc.scd{margin-top:16px}
.lc .scb{border-top:1px solid var(--rule);padding-top:4px}
.lc .scb>.plot{margin-top:8px}
.scd{margin-top:4px;border-top:1px solid var(--rule)}




.scd .plot{margin-top:6px}
.mot .scd{border-top:0}
.plot{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:4px;font-size:13px}
.plot li{line-height:1.4}
.plot .pdesc{display:block;margin-top:2px}
.plot{gap:10px!important}
.plot b{font-family:var(--f-display);font-size:16px;margin-right:6px}
.mot .pd,.plot .pd{font-family:var(--f-mono);font-size:11px;line-height:1.7;color:var(--accent);background:var(--accent-soft);border:0;border-radius:4px;padding:0 5px;margin-right:5px;cursor:pointer;vertical-align:1px;white-space:nowrap}
.pd i{font-style:normal;margin-left:4px;padding-left:4px;border-left:1px solid currentColor}
.plot .ie{font-size:10px;padding:1px 5px;margin-right:2px;vertical-align:1px}
.mot{display:grid;gap:0;border-top:1px solid var(--rule);margin-top:4px}
.mot>div{display:grid;gap:3px;padding-block:14px}
.mot>div+div{border-top:1px dashed var(--rule)}
.mot>div:last-child{padding-bottom:4px}
.mot b{font-weight:600;font-size:14px}




.bigbtn{display:block;text-align:center;margin-top:12px;padding:12px;border-radius:8px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase}














.chip.nodispo .dd{opacity:.55}
.dtitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dlink{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:32px}
.dlink.on{background:var(--accent);color:var(--accent-ink)}
.dsp-empty{margin-top:16px;padding:22px 18px;border:1px dashed var(--rule);border-radius:10px;background:var(--sheet);display:grid;gap:8px;justify-items:start}
.dsp-empty .eh{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dsp-empty b{font-family:var(--f-display);font-size:26px}
.dsp-empty p{margin:0;color:var(--muted);font-size:14px}
.dsp-empty .m{font-family:var(--f-mono);font-size:12px}
.dsp-head{margin-top:12px}
.dsp-head h2{font-family:var(--f-display);font-size:28px;font-weight:700;margin:0;line-height:1}
.dsp-head .date{font-size:14px;color:var(--muted)}
.dtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin-top:12px}
.dt{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
.dt.big{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dt .k{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.75}
.dt .v{font-family:var(--f-mono);font-size:13px;font-weight:500}
.dt.big .v{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1}
.dsec{margin-top:20px}
.dgrid{display:grid;gap:8px}
.dbox{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;display:grid;gap:2px;font-size:14px}
.dk{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dn{font-weight:600}
.ds{font-size:12px;color:var(--muted)}
.what.meal{color:var(--ink)}
.tblw{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
.dtbl{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
.dtbl th{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
.dtbl td{padding:8px 10px;border-top:1px solid var(--rule);font-variant-numeric:tabular-nums}
.dtbl tr:first-child td{border-top:0}

























.empty{margin-top:30px;padding:24px;border:1px dashed var(--rule);border-radius:8px;color:var(--muted);text-align:center}
.src{margin-top:28px;font-size:12px;color:var(--muted);display:grid;gap:2px}
.src span{font-family:var(--f-mono)}

function pickDay(list){

  if(S.day&&list.some(d=>d.id===S.day))return;
  const t=todayISO();
  const next=list.find(d=>d.date>=t);
  S.day=(next||list[list.length-1]||{}).id||null;
}

function dayPlaces(d){

const vEsc=t=>String(t||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1");
function vCardText(p,g){
  const parts=String(p.name||"").trim().split(/\s+/),first=parts[0]||"",last=parts.slice(1).join(" ");
  const L1=["BEGIN:VCARD","VERSION:3.0","N:"+vEsc(last)+";"+vEsc(first)+";;;","FN:"+vEsc(p.name||""),"ORG:"+vEsc("TSCHUGGER Tigerblood")+(g&&g.dept?";"+vEsc(g.dept):"")];
  if(p.role)L1.push("TITLE:"+vEsc(p.role));
  if(p.phone)L1.push("TEL;TYPE=CELL:"+String(p.phone).replace(/[^\d+]/g,""));
  if(p.email)L1.push("EMAIL;TYPE=INTERNET:"+String(p.email).trim());
  L1.push("NOTE:"+vEsc("TSCHUGGER Tigerblood"+(p.role?" – "+p.role:"")),"END:VCARD");
  return L1.join("\r\n")+"\r\n";
}

/* ---------- global search ---------- */
const nrm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function hl(text,terms){let h=esc(text);for(const t of terms){if(!t)continue;const re=new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");h=h.replace(re,"<mark>$1</mark>")}return h}
function searchAll(q){
  let qq=nrm(q).replace(/[,;]/g," ").trim();
  const iso=d=>d.getDate()+"."+(d.getMonth()+1)+".";
  const now=new Date(),tmr=new Date(Date.now()+864e5);
  qq=qq.replace(/\b(heute|today|aujourd'?hui|oggi)\b/g,iso(now)).replace(/\b(morgen|tomorrow|demain|domani)\b/g,iso(tmr));
  qq=qq.replace(/\b(drehtag|day|tag|dt|jour|giorno|j)\s*#?\s*(\d{1,2})\b/g,"d$2").replace(/#(\d{1,2})\b/g,"d$1");
  qq=qq.replace(/\b(\d{1,2})[./](\d{1,2})\.?(?:\d{2,4})?\b/g,(m,a,b)=>(+a)+"."+(+b)+".");
  const terms=qq.split(/\s+/).filter(Boolean);if(!terms.length)return null;
  const isNum=t=>/^\d+[a-z]*$/.test(t)&&!/^\d+(st|nd|rd|th)$/.test(t);
  const digits=x=>String(x||"").replace(/\D/g,"");
  const phoneVars=ph=>{const d=digits(ph);if(!d)return "";const loc=d.startsWith("41")?"0"+d.slice(2):d;return d+" "+loc};
  const dshort=d=>{const x=new Date(d.date+"T12:00:00");return x.getDate()+"."+(x.getMonth()+1)+". "+String(x.getDate()).padStart(2,"0")+"."+String(x.getMonth()+1).padStart(2,"0")+". "+WD[x.getDay()]};
  const cast=(S.meta&&S.meta.cast)||{};
  /* text terms: substring anywhere; numeric terms: only scene numbers, day codes, dates, phone numbers */
  const qd=terms.every(t=>/^\+?\d+$/.test(t))?terms.join("").replace(/\D/g,""):"";
  const match=(text,nums,phone)=>{const T=nrm(text),N=nrm(nums);if(phone&&qd.length>=3&&N.replace(/\s+/g," ").split(" ").some(w=>w.includes(qd)))return true;return terms.every(t=>isNum(t)?N.split(/\s+/).some(w=>w.startsWith(t)):(T.includes(t)||N.includes(t)))};
  const R={day:[],sc:[],loc:[],crew:[],dispo:[],info:[]};
  const WDL=[["sonntag","sunday","dimanche","domenica"],["montag","monday","lundi","lunedi"],["dienstag","tuesday","mardi","martedi"],["mittwoch","wednesday","mercredi","mercoledi"],["donnerstag","thursday","jeudi","giovedi"],["freitag","friday","vendredi","venerdi"],["samstag","saturday","samedi","sabato"]];
  for(const d of S.days){
    const x=new Date(d.date+"T12:00:00");
    const sc1=(d.items||[]).filter(i=>i.sc).length,sc2=((d.unit2&&d.unit2.items)||[]).filter(i=>i.sc).length;
    const kindw=d.kind==="shoot"?"drehtag shooting day tournage riprese":d.kind==="off"?"drehfrei frei day off off-day libre libero":"reise reisetag travel voyage viaggio";
    const text=[d.label,d.short,kindw,WDL[x.getDay()].join(" "),WD[x.getDay()],dshort(d),(d.notes||[]).join(" "),TXA(d,"notes").join(" "),d.info,TX(d,"info"),dayPlaces(d).join(" "),sc2?"2nd unit":"",sc1?"1st unit":""].join(" ");
    if(match(text,nrm(d.short||"")+" "+dshort(d)))R.day.push({k:"day",d,sc1,sc2});
  }
  for(const d of S.days)for(const [u,list] of [["1",d.items||[]],["2",(d.unit2&&d.unit2.items)||[]]])for(const it of list){
    if(!it.sc)continue;const ad=addrForItem(it);
    const sc=nrm(it.sc).replace(/\s+/g,"");
    const text=[it.set,it.d,it.d_de,it.d_fr,ad,it.loc,(it.cast||[]).map(c=>cast[c]||"").join(" "),d.label,d.short,u==="2"?"2nd unit":"1st unit","szene scene"].join(" ");
    const nums=[sc,nrm(it.sc),(it.cast||[]).join(" "),nrm(d.short||""),dshort(d)].join(" ");
    if(!match(text,nums))continue;
    let score=0;for(const t of terms){if(sc===t)score+=100;else if(sc.startsWith(t))score+=40}
    R.sc.push({k:"sc",d,u,it,ad,score});
  }
  R.sc.sort((x,y)=>y.score-x.score||(x.d.date<y.d.date?-1:x.d.date>y.d.date?1:String(x.it.t).localeCompare(String(y.it.t))));
  for(const g of groupLocs()){
    const text=g.s5?[g.title,...g.parts.map(p=>fullAddr(p.it.loc)+" "+p.it.set)].join(" "):[g.title,g.venue,g.address,...g.items.map(l=>[l.name,l.venue,l.address].join(" "))].join(" ");
    const nums=g.s5?g.parts.map(p=>nrm(p.it.sc).replace(/\s+/g,"")).join(" "):g.items.flatMap(l=>(l.sets||[]).flatMap(x=>x.scenes||[])).map(x=>nrm(x).replace(/\s+/g,"")).join(" ");
    if(match(text,nums+" "+nrm(text).replace(/[^0-9a-z ]/g," ")))R.loc.push({k:"loc",g});
  }
  for(const dep of S.crew)for(const pp of (dep.people||[]))if(match([pp.name,pp.role,pp.role_fr,pp.role_en,dep.dept,dep.dept_fr,dep.dept_en,pp.email,pp.note].join(" "),phoneVars(pp.phone),true))R.crew.push({k:"crew",p:pp,dep});
  for(const x of S.dispos){const vals=JSON.stringify(x).replace(/"[a-zA-Z]+":/g," ");if(match(vals,nrm(x.label||"")+" "+dshort(x)))R.dispo.push({k:"dispo",x})}
  for(const c of S.places)for(const it of (c.items||[]))if(match([it.name,it.address,it.note,TX(it,"note"),c.cat,TX(c,"cat")].join(" "),phoneVars(it.phone),true))R.info.push({k:"info",it,c});
  return {R,terms};
}

  box.innerHTML=n?h:'<p class="shint">'+L('Nichts gefunden für')+' «'+esc(q)+'».</p>';
}

const arr=x=>Array.isArray(x)?x:[];
function cleanDay(d){
  const o=Object.assign({},d);o.items=arr(o.items).filter(x=>x&&typeof x==="object");o.notes=arr(o.notes).filter(x=>typeof x==="string");for(const l of ["fr","en"])if(o["notes_"+l]!==undefined)o["notes_"+l]=arr(o["notes_"+l]).filter(x=>typeof x==="string");
  if(o.unit2&&typeof o.unit2==="object")o.unit2=Object.assign({},o.unit2,{items:arr(o.unit2.items).filter(x=>x&&typeof x==="object"),notes:arr(o.unit2.notes)});else delete o.unit2;
  return o;
}
const CLEAN={
  days:list=>list.filter(d=>d&&typeof d.date==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(d.date)).map(cleanDay).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0),
  crew:list=>list.map(c=>Object.assign({},c,{people:arr(c.people)})),
  locs:list=>list.map(l=>Object.assign({},l,{sets:arr(l.sets).map(x=>Object.assign({},x,{scenes:arr(x.scenes).map(String)}))})),
  places:list=>list.map(c=>Object.assign({},c,{items:arr(c.items)})),
  dispos:list=>list.filter(x=>x&&typeof x.date==="string"),
};
const rows=snap=>snap.docs.map(d=>Object.assign({id:d.id},d.data()));
const SOURCES=[["days","days","date"],["crew","crew","order"],["locations","locs","order"],["places","places","order"],["dispos","dispos","date"]];
function setData(key,list){S[key]=(CLEAN[key]||(x=>x))(list);MEMO.clear();saveCache()}

const CACHE_KEY="crewcache:v1";let cacheT=null;
function saveCache(){clearTimeout(cacheT);cacheT=setTimeout(()=>{try{localStorage.setItem(CACHE_KEY,JSON.stringify({meta:S.meta,days:S.days,crew:S.crew,locs:S.locs,places:S.places,dispos:S.dispos}))}catch(_){}},1500)}
function loadCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");if(!c||!Array.isArray(c.days))return false;S.meta=c.meta||null;for(const k of ["days","crew","locs","places","dispos"])S[k]=(CLEAN[k]||(x=>x))(arr(c[k]));MEMO.clear();return true}catch(_){return false}}
/* several snapshots arrive together on start: draw once per frame */
let RQ=0;function scheduleRender(){if(RQ)return;RQ=1;const go=()=>{if(!RQ)return;RQ=0;render()};requestAnimationFrame(go);setTimeout(go,120)}
async function reloadAll(db){
  const [mt,...lists]=await Promise.all([db.doc("meta/info").get(),...SOURCES.map(([col,,ord])=>db.collection(col).orderBy(ord).get())]);

      await A.updatePassword(u,f.pw.value);msg.classList.add("ok");msg.textContent=L("Passwort geändert.");f.reset();
    }else{
      await A.verifyBeforeUpdateEmail(u,f.em.value.trim(),{url:location.origin+location.pathname});msg.classList.add("ok");msg.textContent=L("Bestätigungslink an die neue Adresse gesendet. Die Änderung gilt, sobald du ihn antippst.");f.reset();
    }
  }catch(err){console.error(err);msg.textContent=err&&err.code==="x"?err.message:(/email-already-in-use/.test(err.code||"")?L("Diese Adresse wird schon verwendet."):errText(err))}
  btn.disabled=false;
}
/* ---- admin: invitations and members (German only; visible to admins) ---- */
const ADM={inv:[],mem:[],adm:[],q:"",loaded:false,busy:false};
async function admLoad(){
  const {F,db}=await fb();
  const [i,m,a]=await Promise.all([F.getDocs(F.collection(db,"invites")),F.getDocs(F.collection(db,"members")),F.getDocs(F.collection(db,"admins")).catch(()=>({docs:[]}))]);
  ADM.adm=a.docs.map(d=>d.id);ADM.inv=i.docs.map(d=>Object.assign({id:d.id},d.data()));ADM.mem=m.docs.map(d=>Object.assign({uid:d.id},d.data()));ADM.loaded=true;render();
}
function crewEmails(){const out=[],seen=new Set();for(const g of S.crew)for(const p of (g.people||[])){const e=lc(p.email);if(!e||!/@/.test(e)||seen.has(e))continue;seen.add(e);out.push({email:e,name:p.name||"",role:p.role||""})}return out}
function cateringHTML(){
  const act=ADM.mem.filter(m=>m.active===true).map(normDiet);if(!act.length)return"";
  const c={};act.forEach(m=>{if(m.diet&&m.diet!=="none")c["d:"+m.diet]=(c["d:"+m.diet]||0)+1;m.intol.forEach(k=>c["i:"+k]=(c["i:"+k]||0)+1)});
  const parts=[...DIETS.filter(d=>c["d:"+d[0]]).map(d=>c["d:"+d[0]]+" "+L(d[1])),...INTOL.filter(i=>c["i:"+i[0]]).map(i=>c["i:"+i[0]]+" "+L(i[1]))];
  const al=act.filter(m=>String(m.allergies||"").trim()).map(m=>([m.firstName,m.lastName].filter(Boolean).join(" ")||m.name||(crewPerson(m.email)||{}).name||m.email)+": "+m.allergies.trim());
  return '<div class="cater"><b>Catering</b> · '+act.length+' '+esc(L("aktiv"))+' · '+act.filter(m=>!m.diet||m.diet==="none").length+' '+esc(L("Ich esse alles"))+(parts.length?'<br>'+esc(parts.join(" · ")):'')+(al.length?'<br><span>'+esc(L("Allergien"))+': '+esc(al.join(" · "))+'</span>':'')+'</div>';
}
VIEWS.admin=function(){
  if(!isAdmin())return '<div class="empty">'+L("Kein Zugang")+'</div>';
  if(!ADM.loaded){admLoad().catch(err=>{console.error(err);showMsg("Benutzerliste konnte nicht geladen werden: "+(err.message||err),6000)});return '<div class="empty">Lade Benutzer …</div>'}
  const memBy={};ADM.mem.forEach(m=>memBy[m.email]=m);
  const invBy={};ADM.inv.forEach(i=>invBy[i.id]=i);
  const rows=[];const seen=new Set();
  /* display name: crew list first, otherwise the first/last name the person entered */
  const nm=m=>{if(!m)return"";const cp=crewPerson(m.email);return (cp&&cp.name)||[m.firstName,m.lastName].filter(Boolean).join(" ")||m.name||""};
  for(const i of ADM.inv){const m=memBy[i.id];rows.push({email:i.id,name:nm(m)||i.name||"",inv:true,m});seen.add(i.id)}
  for(const m of ADM.mem)if(!seen.has(m.email))rows.push({email:m.email,name:nm(m),inv:false,m});
  rows.sort((a,b)=>(a.name||a.email).localeCompare(b.name||b.email,"de"));
  const q=lc(ADM.q);const vis=rows.filter(r=>!q||(r.email+" "+r.name).toLowerCase().includes(q));
  const newCrew=crewEmails().filter(c=>!invBy[c.email]&&!memBy[c.email]);
  const st=r=>r.m?(r.m.active===true?'<span class="ust ok">aktiv</span>':'<span class="ust off">gesperrt</span>'):'<span class="ust wait">eingeladen</span>';
  const site=location.origin+location.pathname;
  const mail=r=>"mailto:"+encodeURIComponent(r.email)+"?subject="+encodeURIComponent("TSCHUGGER Tigerblood – Crew-App")+"&body="+encodeURIComponent("Hallo"+(r.name?" "+r.name.split(" ")[0]:"")+"\n\nDu bist für die Crew-App von TSCHUGGER Tigerblood freigeschaltet:\n"+site+"\n\nBeim ersten Mal auf «Erstes Mal hier? Konto erstellen» tippen, mit dieser Adresse ("+r.email+") ein eigenes Passwort wählen und die Bestätigungsmail antippen.\n\nBis bald im Wallis!");
  const own=isOwner();const isAdm=e=>ADMINS.includes(e)||ADM.adm.includes(e);
  const admSec=own?'<div class="admins"><h3>Administratoren</h3><p class="ahint">Administratoren können Leute einladen und sehen in der Crew Essen und Geburtstage. Sperren und Entfernen kannst nur du.</p>'+
    '<div class="arow"><span>'+esc(ADMINS[0])+'</span><span class="ust ok">Haupt-Admin</span></div>'+
    ADM.adm.map(e=>[e,((rows.find(r=>r.email===e)||{}).name)||(crewPerson(e)||{}).name||""]).sort((a,b)=>(a[1]||a[0]).localeCompare(b[1]||b[0],"de")).map(([e,n])=>'<div class="arow"><span>'+esc(n||e)+'</span><button data-adm="rmadmin" data-em="'+esc(e)+'">Entfernen</button></div>').join("")+
    '<form class="aform" data-adm="addadmin"><select name="em" required><option value="">Person auswählen …</option>'+rows.filter(r=>!isAdm(r.email)).map(r=>'<option value="'+esc(r.email)+'">'+esc(r.name||r.email)+'</option>').join("")+'</select><button type="submit">Als Admin hinzufügen</button></form></div>':'';
  let h='<section class="adm"><h2 class="dh">Benutzer verwalten</h2><p class="ahint">Nur eingeladene Adressen können ein Konto erstellen (E-Mail/Passwort oder Google). Gesperrte oder entfernte Personen kommen sofort nicht mehr in die App. Passwort und E-Mail-Adresse verwaltet jede Person selbst.</p>'+
    admSec+
    '<form class="aform" data-adm="add"><input name="em" type="email" placeholder="E-Mail-Adresse" required><input name="nm" type="text" placeholder="Name (optional)"><button type="submit">Einladen</button></form>'+
    (newCrew.length?'<button class="abtn" data-adm="crew">Alle '+newCrew.length+' Adressen aus der Crewliste einladen</button>':'')+
    '<div class="astats">'+rows.length+' Benutzer · '+rows.filter(r=>r.m&&r.m.active===true).length+' aktiv · '+rows.filter(r=>!r.m).length+' noch nicht registriert</div>'+
    '<input class="search" id="aq" type="search" placeholder="Benutzer suchen" value="'+esc(ADM.q)+'">'+
    '<div class="people">'+vis.map(r=>'<div class="p"><div class="hd"><span class="nm">'+esc(r.name||r.email)+'</span>'+(isAdm(r.email)?'<span class="ust adm">Admin</span>':'')+st(r)+'</div><div class="ct"><span class="em">'+esc(r.email)+'</span>'+(r.m&&r.m.lang?'<span>'+esc(r.m.lang.toUpperCase())+'</span>':'')+'</div><div class="aacts">'+
      (!r.m?'<a href="'+mail(r)+'">Einladungsmail</a>':'')+
      (own&&!ADMINS.includes(r.email)?(ADM.adm.includes(r.email)?'<button data-adm="rmadmin" data-em="'+esc(r.email)+'">Admin entfernen</button>':'<button data-adm="mkadmin" data-em="'+esc(r.email)+'">Zum Admin machen</button>'):'')+
      (own&&r.m?(r.m.active===true?'<button data-adm="block" data-uid="'+esc(r.m.uid)+'">Sperren</button>':'<button data-adm="unblock" data-uid="'+esc(r.m.uid)+'">Entsperren</button>'):'')+
      (own&&r.m?'<button data-adm="remove" data-uid="'+esc(r.m.uid)+'" data-em="'+esc(r.email)+'">Entfernen</button>':(r.inv&&!r.m?'<button data-adm="uninvite" data-em="'+esc(r.email)+'">Einladung löschen</button>':''))+
      '</div></div>').join("")+'</div></section>';
  return h;
};
document.addEventListener("input",e=>{if(e.target.id==="aq"){ADM.q=e.target.value;const p=e.target.selectionStart;render();const i=$("#aq");if(i){i.focus();i.setSelectionRange(p,p)}}});
document.addEventListener("submit",async e=>{
  const fa=e.target.closest('[data-adm="addadmin"]');
  if(fa){e.preventDefault();if(!isOwner())return;const em=lc(fa.em.value);if(!/@/.test(em))return;
    try{const {F,db}=await fb();await F.setDoc(F.doc(db,"admins",em),{addedAt:F.serverTimestamp()});if(!ADM.inv.some(i=>i.id===em)&&!ADM.mem.some(m=>m.email===em)){const cp=crewPerson(em);await F.setDoc(F.doc(db,"invites",em),{name:(cp&&cp.name)||"",addedAt:F.serverTimestamp()})}showMsg(em+" ist jetzt Admin.",3000);await admLoad()}catch(err){showMsg("Fehler: "+(err.message||err),6000)}
    return}
  const f=e.target.closest('[data-adm="add"]');if(!f)return;e.preventDefault();
  const em=lc(f.em.value),nm=f.nm.value.trim();if(!/@/.test(em))return;
  try{const {F,db}=await fb();await F.setDoc(F.doc(db,"invites",em),{name:nm,addedAt:F.serverTimestamp()});showMsg(em+" eingeladen.",3000);await admLoad()}catch(err){showMsg("Fehler: "+(err.message||err),6000)}
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("button[data-adm]");if(!b||ADM.busy)return;ADM.busy=true;
  try{
    const {F,db}=await fb();const a=b.dataset.adm;
    if(a==="crew"){const list=crewEmails().filter(c=>!ADM.inv.some(i=>i.id===c.email)&&!ADM.mem.some(m=>m.email===c.email));
      if(confirmSafe(list.length+" Adressen aus der Crewliste einladen?")){
        for(let i=0;i<list.length;i+=400){const batch=F.writeBatch(db);list.slice(i,i+400).forEach(c=>batch.set(F.doc(db,"invites",c.email),{name:c.name,role:c.role,addedAt:F.serverTimestamp()}));await batch.commit()}
        showMsg(list.length+" Adressen eingeladen.",4000)}}
    else if(a==="block"){await F.updateDoc(F.doc(db,"members",b.dataset.uid),{active:false});showMsg("Gesperrt.",3000)}
    else if(a==="unblock"){await F.updateDoc(F.doc(db,"members",b.dataset.uid),{active:true});showMsg("Entsperrt.",3000)}
    else if(a==="remove"){if(confirmSafe(b.dataset.em+" entfernen? Die Person kommt danach nicht mehr in die App.")){await F.deleteDoc(F.doc(db,"invites",b.dataset.em)).catch(()=>{});await F.deleteDoc(F.doc(db,"members",b.dataset.uid));showMsg("Entfernt.",3000)}}
    else if(a==="mkadmin"&&isOwner()){await F.setDoc(F.doc(db,"admins",b.dataset.em),{addedAt:F.serverTimestamp()});showMsg(b.dataset.em+" ist jetzt Admin.",3000)}
    else if(a==="rmadmin"&&isOwner()){if(confirmSafe(b.dataset.em+" die Admin-Rechte entziehen?")){await F.deleteDoc(F.doc(db,"admins",b.dataset.em));showMsg("Admin-Rechte entzogen.",3000)}}
    else if(a==="uninvite"){await F.deleteDoc(F.doc(db,"invites",b.dataset.em));showMsg("Einladung gelöscht.",3000)}
    await admLoad();
  }catch(err){console.error(err);showMsg("Fehler: "+(err.message||err),6000)}
  ADM.busy=false;
});
/* Crew tab: admins see food preferences next to each person (matched by e-mail) */
/* Crew tab (admins only): toggles for food preferences and birthdays */
/* food + birthdays are on by default for admins; the choice is remembered (v2 keys reset older "off" states) */
const ADMV={food:true,bday:true,bcal:false};try{for(const k in ADMV){const v=localStorage.getItem("admv2:"+k);if(v!==null)ADMV[k]=v==="1"}}catch(_){}
const ensureAdm=()=>{if(!ADM.loaded&&!ADM.busy&&!ADM.loading&&!ADM.err){ADM.loading=true;admLoad().then(()=>{ADM.err=""}).catch(err=>{console.error(err);ADM.err=String((err&&(err.code||err.message))||err);render()}).finally(()=>{ADM.loading=false})}};
/* crew entry -> member: same e-mail, otherwise same first + last name */
const nkey=t=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z]+/g," ").trim();
function memberFor(p){
  const e=lc(p.email);let m=e&&ADM.mem.find(x=>x.email===e);if(m)return m;
  const k=nkey(p.name);if(!k)return null;
  return ADM.mem.find(x=>nkey([x.firstName,x.lastName].filter(Boolean).join(" "))===k||nkey(x.name)===k)||null;
}
const bdShort=iso=>{const m=/^\d{4}-(\d\d)-(\d\d)$/.exec(iso||"");return m?m[2]+"."+m[1]+".":""};
function bdayHTML(){
  const ds=S.days.map(d=>d.date).filter(Boolean).sort();if(!ds.length)return"";
  const name=m=>[m.firstName,m.lastName].filter(Boolean).join(" ")||m.name||(crewPerson(m.email)||{}).name||m.email;
  const y=ds[0].slice(0,4),from=ds[0].slice(5),to=ds[ds.length-1].slice(5);
  const hits=ADM.mem.filter(m=>m.active===true&&/^\d{4}-\d\d-\d\d$/.test(m.birthday||"")).map(m=>({m,md:m.birthday.slice(5)})).filter(x=>x.md>=from&&x.md<=to).sort((a,b)=>a.md<b.md?-1:a.md>b.md?1:name(a.m).localeCompare(name(b.m)));
  return '<div class="bcal"><b>'+esc(L("Geburtstage während des Drehs"))+'</b>'+(hits.length?hits.map(x=>{const d=new Date(y+"-"+x.md+"T12:00:00");return '<div class="bl"><span>'+esc(WD[d.getDay()]+" "+pad2(d.getDate())+"."+pad2(d.getMonth()+1)+".")+'</span><b>'+esc(name(x.m))+'</b></div>'}).join(""):'<p class="ghint">'+esc(L("Keine Geburtstage während des Drehs."))+'</p>')+'</div>';
}
const ICO={bcal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13.5c-.7-.7-.7-1.6 0-2.3.7.7.7 1.6 0 2.3zM12 14v3"/>',food:'<path d="M7 2v8M4 2v5a3 3 0 0 0 6 0V2M7 10v12M17 2c-2 1.5-3 4-3 7h3v13"/>',bday:'<path d="M4 21h16M5 21v-8h14v8M12 13V9M12 6.5c-1-1-1-2.5 0-3.5 1 1 1 2.5 0 3.5zM5 16c2.3 1.5 4.7 1.5 7 0s4.7-1.5 7 0"/>'};
const togBtn=(k,t)=>'<button type="button" class="foodtog ico" data-admv="'+k+'" aria-pressed="'+ADMV[k]+'" aria-label="'+esc(L(t))+'" title="'+esc(L(t))+'"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICO[k]+'</svg></button>';
window.crewHead=function(){
  if(!isAdmin())return"";
  if(ADMV.food||ADMV.bday||ADMV.bcal)ensureAdm();
  return '<div class="admv">'+togBtn("food","Essen")+(ADM.err&&(ADMV.food||ADMV.bday||ADMV.bcal)?'<span class="admerr">Benutzerdaten nicht lesbar ('+esc(ADM.err)+') – Firestore-Regeln prüfen.</span>':'')+togBtn("bday","Geburtstage")+togBtn("bcal","Geburtstagskalender")+'<button type="button" class="foodtog ico vcall" data-vcall aria-label="'+esc(L("Alle Kontakte als VCF"))+'" title="'+esc(L("Alle Kontakte als VCF"))+'"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7" r="3"/><path d="M2.5 17c0-3 2.5-5 5.5-5 1.3 0 2.5.4 3.4 1M15 3v10M11.5 9.5 15 13l3.5-3.5M11 20h9"/></svg><b>VCF</b></button>'+'</div>'+(ADM.loaded?(ADMV.bcal?bdayHTML():"")+(ADMV.food?cateringHTML():""):"");
};
document.addEventListener("click",e=>{if(!e.target.closest("[data-vcall]")||!isAdmin())return;const {text,n}=allVCards();if(!n)return;saveVcf(text,"TSCHUGGER Tigerblood Crew");showMsg(n+" "+L("Kontakte als VCF gespeichert."),4000)});
document.addEventListener("click",e=>{const b=e.target.closest("[data-admv]");if(!b)return;const k=b.dataset.admv;ADMV[k]=!ADMV[k];ADM.err="";if(ADMV[k]&&!ADM.loading)ADM.loaded=false;try{localStorage.setItem("admv2:"+k,ADMV[k]?"1":"0")}catch(_){}render()});
window.crewExtra=function(p){
  if(!isAdmin()||!(ADMV.food||ADMV.bday)||!p)return"";
  if(!ADM.loaded){ensureAdm();return ADM.err?"":'<div class="pinfo"><span class="na">…</span></div>'}
  const m=memberFor(p);

  const ch=[];
  if(ADMV.bday){const b=bdShort(m.birthday);ch.push(b?'<span class="bday">'+esc(L("Geburtstag"))+' '+esc(b)+'</span>':'<span class="na">'+esc(L("Geburtstag"))+': –</span>')}
  if(ADMV.food){const t=dietText(m);ch.push(t?'<span class="diet">'+esc(t)+'</span>':(m.diet?'<span class="diet">'+esc(L("Ich esse alles"))+'</span>':'<span class="na">'+esc(L("Essen"))+': '+esc(L("keine Angaben"))+'</span>'))}
  return '<div class="pinfo">'+ch.join("")+'</div>';
};

function confirmSafe(t){try{return window.confirm(t)}catch(_){return true}}

/* ---------- new app version: reload once when the published version differs ---------- */
const APP_VER="a3254dacde";
async function checkVersion(){
  try{const r=await fetch("version.txt?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const v=(await r.text()).trim();
    if(!v||v===APP_VER)return;
    let done="";try{done=sessionStorage.getItem("reloadedFor")||""}catch(_){}
    if(done===v)return;try{sessionStorage.setItem("reloadedFor",v)}catch(_){}
    if(document.querySelector("#acct:not([hidden]) form input:focus,#gate:not([hidden]) input:focus"))return;
    location.reload();
  }catch(_){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkVersion()});
setTimeout(checkVersion,1500);
/* ---------- start ---------- */
applyStatic();
loadCache();
render();
(async()=>{
  const b=$("#refresh");b.hidden=false;
  b.addEventListener("click",async()=>{
    if(b.classList.contains("spin"))return;b.classList.add("spin");
    try{if(await load(true)){const c=lastCheck(S.meta);showMsg(L("Neueste Daten geladen.")+(c?" "+L("Dropbox zuletzt geprüft")+" "+fmtStamp(c)+".":""),5000)}}
    catch(err){console.error(err);showMsg(isOffline(err)&&S.days.length?L("Offline – du siehst den zuletzt geladenen Stand."):loadErr(err),6000)}
    setTimeout(()=>b.classList.remove("spin"),400);
  });
  if(!S.loaded&&!S.days.length)showGate("wait");
  try{
    const {A,auth}=await fb();
    await A.setPersistence(auth,A.browserLocalPersistence).catch(()=>{});
    A.getRedirectResult(auth).catch(err=>{console.error(err);showGate("login",errText(err),true)});
    A.onAuthStateChanged(auth,u=>{
      if(!u){ME=null;acctButton(false);clearLocal();if(S.tab==="admin")S.tab="plan";render();showGate("login");return}
      afterSignIn(u);
    });
  }catch(err){console.error(err);if(!S.days.length)showGate("login",L("Anmeldung nicht erreichbar. Bitte Internetverbindung prüfen."),true);else{hideGate();showMsg(L("Offline – du siehst den zuletzt geladenen Stand."),6000)}}
  const tick=async()=>{
    if(document.visibilityState!=="visible"||!ME||!ME.emailVerified)return;
    try{const st=await checkMember();if(st!=="ok"){clearLocal();render();showGate(st==="blocked"?"blocked":"denied");return}}catch(_){return}
    load(false).catch(()=>{});
  };
  setInterval(tick,POLL_MS);
  document.addEventListener("visibilitychange",tick);
})();
